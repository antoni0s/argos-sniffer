name: V6 step 14e - packet normalization engine gate

on:
  push:
    branches: [version-6]
    paths:
      - 'src/argos_packet.h'
      - 'tests/test_packet.c'
      - '.github/scripts/v6_step14e_extract_packet_engine.py'
      - '.github/workflows/v6-step14e-packet-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile production baseline
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-before-packet

      - name: Apply staged packet engine extraction
        run: python3 .github/scripts/v6_step14e_extract_packet_engine.py

      - name: Architecture and hot-path invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text()
          packet = Path('src/argos_packet.h').read_text()
          assert src.count('#include "argos_packet.h"') == 1
          assert 'argos_packet_view_t packet_view;' in src
          assert 'argos_packet_decode(pkt_type, buffer, (int)len, opt_v6, &packet_view)' in src
          assert 'static int strip_l2(' not in src
          assert 'static int skip_ipv6_exthdrs(' not in src
          assert 'static int ipv4_header_info(' not in src
          assert 'static int ipv6_packet_info(' not in src
          for symbol in ('argos_packet_view_t', 'argos_packet_decode', 'argos_packet_strip_l2',
                         'argos_packet_ipv6_l4', 'ipv4_header_info', 'ipv6_packet_info'):
              assert symbol in packet
          assert 'malloc(' not in packet and 'calloc(' not in packet and 'realloc(' not in packet
          assert 'memcpy(v->frame' not in packet
          assert 'const unsigned char *frame;' in packet
          assert 'packet_view.packet_end' in src
          print('Packet engine architecture/hot-path invariants: PASS')
          PY

      - name: Packet normalization fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_packet.c -o /tmp/test-packet
          /tmp/test-packet

      - name: Packet normalization sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_packet.c -o /tmp/test-packet-san
          /tmp/test-packet-san

      - name: Full fixture regression
        run: |
          for source in tests/test_*.c; do
            name="$(basename "${source}" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "${source}" -lm -o "/tmp/${name}"
            "/tmp/${name}"
          done

      - name: Strict native builds and size guard
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-after-packet
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-after-packet-stub
          python3 - <<'PY'
          import subprocess
          def text_size(path):
              fields = subprocess.check_output(['size', path], text=True).splitlines()[1].split()
              return int(fields[0])
          before = text_size('/tmp/argos-before-packet')
          after = text_size('/tmp/argos-after-packet')
          assert after <= before, f'optimized text grew: before={before} after={after}'
          print(f'Optimized text size guard: PASS ({before} -> {after})')
          PY

      - name: Install ARM64 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Strict ARM64 builds
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-packet-arm64
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-packet-arm64-stub

      - name: Commit production packet engine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_packet.h src/argos-sniffer.c tests/test_packet.c \
            .github/workflows/v6-identity-regression.yml
          git diff --cached --check
          git commit -m 'refactor(v6): extract packet normalization engine'
          git push origin HEAD:version-6
