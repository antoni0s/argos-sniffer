name: V6 network visibility regression

on:
  push:
    branches: [version-6]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-visibility:
    name: Network visibility fixtures and sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: STUN TURN control fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_stun_turn.c -o /tmp/test-stun-turn
          /tmp/test-stun-turn

      - name: MQTT CONNECT fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_mqtt.c -o /tmp/test-mqtt
          /tmp/test-mqtt

      - name: CoAP control fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_coap.c -o /tmp/test-coap
          /tmp/test-coap

      - name: IGMP MLD membership fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_igmp_mld.c -o /tmp/test-igmp-mld
          /tmp/test-igmp-mld

      - name: NTP time-message fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_ntp.c -o /tmp/test-ntp
          /tmp/test-ntp

      - name: WireGuard structural fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_wireguard.c -o /tmp/test-wireguard
          /tmp/test-wireguard

      - name: DNSEXT correlation fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dns_track.c -o /tmp/test-dns-track
          /tmp/test-dns-track

      - name: Dynamic BPF network matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-bpf
          /tmp/test-bpf

      - name: Network visibility sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_stun_turn.c -o /tmp/test-stun-turn-san
          /tmp/test-stun-turn-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_mqtt.c -o /tmp/test-mqtt-san
          /tmp/test-mqtt-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_coap.c -o /tmp/test-coap-san
          /tmp/test-coap-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_igmp_mld.c -o /tmp/test-igmp-mld-san
          /tmp/test-igmp-mld-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_ntp.c -o /tmp/test-ntp-san
          /tmp/test-ntp-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_wireguard.c -o /tmp/test-wireguard-san
          /tmp/test-wireguard-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_dns_track.c -o /tmp/test-dns-track-san
          /tmp/test-dns-track-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_dynamic_bpf.c -o /tmp/test-bpf-san
          /tmp/test-bpf-san

      - name: Network privacy and suppression invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_enterprise.h').read_text()
          m=Path('src/argos_multicast_membership.h').read_text()
          w=Path('src/argos_wireguard.h').read_text()
          d=Path('src/argos_dns_track.h').read_text()
          b=Path('src/argos_bpf.h').read_text()
          p=Path('src/argos_enterprise_ports.h').read_text()
          t=Path('src/argos_tls_ports.h').read_text()
          f=Path('src/argos_flow_state.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          hl=h.lower()
          assert 'ARGOS_STUN_TURN_UDP_PORT 3478U' in p
          assert 'case 3478: return ae_stun_turn' in h
          assert 'method == 0x006U || method == 0x007U' in h
          assert 'case 0x0013U: return 0' in h
          for term in ('transaction id','username','realm','nonce','userhash'):
              assert term in hl
          assert 'never emitted' in hl and 'remain opaque' in hl
          assert 'ARGOS_ENTERPRISE_UDP_PORTS[i] == ARGOS_STUN_TURN_UDP_PORT' in b
          assert 'BPF_ALU | BPF_AND | BPF_K, 0xc0' in b
          assert '0x0016' in b and '0x0017' in b
          assert 'ChannelData' in b and 'elephant flow' in b

          assert '1883' in p and 'case 1883: return ae_mqtt' in h
          assert '8883U   /* MQTT over implicit TLS */' in t
          assert 'ae_set(r,"mqtt",1,' in h
          assert 'client_id_hash=%08x' in h and 'client_id_len=%u' in h
          assert 'Username, password and Will topic/payload' in h
          assert 'argos_flow_note_payload' in f and 'argos_flow_note_payload(&app_flow_state' in s and 'ent_tcp.complete' in s
          assert 'device-secret-123' not in h and 'alice@example.org' not in h

          assert '5683' in p and '5684' not in p
          assert 'case 5683: return ae_coap' in h
          assert 'Token, Message ID, Uri-Host' in h
          assert 'uri_path_segments=%u' in h and 'uri_query_parts=%u' in h
          assert 'proxy_uri=%u' in h and 'payload=%u' in h
          assert 'sensors' not in h and 'SECRET' not in h

          assert 'argos_igmp_parse' in m and 'argos_mld_parse' in m
          assert 'records > 64U' in m and 'nsrc > 1024U' in m
          assert 'protocol == 2U && ttl == 1U' in s
          assert 'IPPROTO_ICMPV6' in s and 'argos_mld_parse' in s
          assert 'BPF_JEQ | BPF_K, 2' in b
          assert '239.1.2.3' not in m and 'ff02' not in m.lower()

          assert '111, 123, 161' in p and 'case 123: return ae_ntp' in h
          assert 'Reference ID and all four 64-bit' in h
          assert 'mode < 1U || mode > 5U' in h
          assert 'extra_bytes=%u' in h
          assert 'PRIV' not in h and 'REF-TIME' not in h

          assert 'len != 148U' in w and 'len != 92U' in w and 'len != 64U' in w
          assert 'p[1] != 0U || p[2] != 0U || p[3] != 0U' in w
          assert 'len < 32U || (len & 15U) != 0U' in w
          assert 'keys, MACs, cookies and ciphertext stay opaque' in w
          assert '--wireguard-port' in s and 'runtime_cfg.wireguard_port' in s
          assert '.wireguard_port = (uint16_t)(runtime_cfg.enterprise_enabled ? runtime_cfg.wireguard_port : 0U)' in s
          assert 'cfg->wireguard_port' in b and 'WireGuard|%s' in s

          assert 'ARGOS_DNS_TRACK_PROBES 8U' in d and 'ARGOS_DNS_TRACK_TTL_USEC 5000000ULL' in d
          for field in ('client_addr[16]','server_addr[16]','client_port','server_port','qname_hash','qtype','txid','ip_version'):
              assert field in d
          assert 'memcmp(e->client_addr' in d and 'memcmp(e->server_addr' in d
          assert 'flow_dst_addr, flow_src_addr' in s
          assert 'dport, sport, txid, response_qtype, response_qname' in s
          assert 'tracked->valid = 0' in s
          assert 'flow_src_key' not in s and 'flow_dst_key' not in s and 'addr6_key(' not in s
          assert '(txid ^' not in s
          print('Network visibility permanent privacy/suppression invariants: PASS')
          PY
