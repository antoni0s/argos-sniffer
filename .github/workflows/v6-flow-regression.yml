name: V6 flow suppression regression

on:
  push:
    branches: [version-6]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow-suppression:
    name: Flow suppression fixtures and sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TCP inspect-once generation fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_app_flow.c -lm -o /tmp/test-app-flow
          /tmp/test-app-flow
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_ntlm_flow_completion.c -o /tmp/test-ntlm-flow
          /tmp/test-ntlm-flow

      - name: Bounded UDP class suppression fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_udp_suppress.c -o /tmp/test-udp-suppress
          /tmp/test-udp-suppress
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_wireguard.c -o /tmp/test-wireguard
          /tmp/test-wireguard

      - name: Flow suppression sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_app_flow.c -lm -o /tmp/test-app-flow-san
          /tmp/test-app-flow-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_ntlm_flow_completion.c -o /tmp/test-ntlm-flow-san
          /tmp/test-ntlm-flow-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_udp_suppress.c -o /tmp/test-udp-suppress-san
          /tmp/test-udp-suppress-san

      - name: Flow-state invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/argos-sniffer.c').read_text()
          f=Path('src/argos_flow_state.h').read_text()
          e=Path('src/argos_enterprise.h').read_text()
          u=Path('src/argos_udp_suppress.h').read_text()
          w=Path('src/argos_wireguard.h').read_text()

          # Generic TCP generation/DONE state is isolated from parser policy.
          assert 'ARGOS_FLOW_SLOTS 1024U' in f
          assert 'ARGOS_FLOW_PROBES 4U' in f
          assert 'ARGOS_FLOW_TTL_SECS 60' in f
          assert 'ARGOS_FLOW_PACKET_BUDGET 8U' in f
          assert 'malloc(' not in f and 'calloc(' not in f and 'realloc(' not in f
          assert 'argos_flow_reset_pair' in f
          assert 'rapid 5-tuple reuse' in f
          assert '#include "argos_flow_state.h"' in s
          assert 'static argos_flow_state_t app_flow_state = {0};' in s
          assert 'if (tcp->syn && !tcp->ack)' in s
          assert 'argos_flow_reset_pair(&app_flow_state' in s
          assert 'argos_flow_should_skip(&app_flow_state' in s
          assert 'argos_flow_note_payload(&app_flow_state' in s
          assert 'static int app_flow_payload_complete' in s
          assert 'if (ent_tcp_seen && ent_tcp.complete) fingerprint_complete = 1;' in s
          assert 'app_flow_table' not in s and 'app_flow_entry_t' not in s

          # Multi-message NTLM remains inspectable until Type 3 / packet budget.
          assert 'ae_set(r, "smb2", 0, "command=session-setup auth=spnego")' in e
          assert 'ae_set(r, "smb2-ntlm", mt == 3U,' in e
          assert 'Type 1/2 must not mark the TCP' in e

          # UDP class suppression remains a separate, narrower mechanism.
          assert 'ARGOS_UDP_SUPPRESS_SLOTS 256U' in u
          assert 'ARGOS_UDP_SUPPRESS_PROBES 2U' in u
          assert 'ARGOS_UDP_SUPPRESS_TTL_SECS 5U' in u
          assert 'Suppressed hits deliberately do NOT refresh' in u
          assert 'argos_wireguard_transport_kind' in w
          assert 'wg_transport == 2' in s
          assert 'argos_udp_suppress_recent(udp_suppress_table' in s
          assert 'Handshake/cookie types' in s and 'keepalives are always parsed' in s
          assert 'DNS/DHCP/QUIC/STUN/CoAP/NTP' in s
          assert 'if (runtime_cfg.enterprise_enabled && argos_enterprise_udp_port(sport, dport))' in s
          print('Flow suppression permanent invariants: PASS')
          PY
