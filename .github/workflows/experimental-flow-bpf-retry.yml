name: Experimental flow/BPF retry

on:
  push:
    branches:
      - feature/span-sensor
    paths:
      - .github/workflows/experimental-flow-bpf-retry.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/span-sensor
          fetch-depth: 0

      - name: Reuse patch payload
        shell: bash
        run: |
          PAYLOAD=$(sed -n "s/.*echo '\([^']*\)' | base64 -d.*/\1/p" .github/workflows/experimental-flow-bpf.yml)
          test -n "$PAYLOAD"
          printf '%s' "$PAYLOAD" | base64 -d > /tmp/argos_patch.py
          python3 /tmp/argos_patch.py

      - name: Strict compile and kernel smoke test
        shell: bash
        run: |
          git diff --check
          grep -q '#define VERSION "5.3.1"' src/argos-sniffer.c
          grep -q 'APP_FLOW_PACKET_BUDGET 8' src/argos-sniffer.c
          grep -q 'SO_ATTACH_FILTER' src/argos-sniffer.c
          grep -q 'int rcvbuf = 2 \* 1024 \* 1024' src/argos-sniffer.c
          grep -q 'recvmsg(current_iface->fd, &msg, MSG_TRUNC)' src/argos-sniffer.c
          ! grep -q 'RX_DRAIN_BUDGET' src/argos-sniffer.c
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          strings /tmp/argos-sniffer | grep -q '5.3.1'
          IFACE=$(ip -o link show | awk -F': ' '$2 != "lo" {split($2,a,"@"); print a[1]; exit}')
          test -n "$IFACE"
          set +e
          sudo timeout 2 /tmp/argos-sniffer -i "$IFACE" -s -q -t -h -l -v >/dev/null 2>/tmp/argos-smoke.err
          RC=$?
          set -e
          test "$RC" -eq 124 -o "$RC" -eq 0
          ! grep -q 'unable to attach AF_PACKET prefilter' /tmp/argos-smoke.err

      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c
          git commit -m 'Experiment 5.3.1: suppress completed app flows and prefilter bulk traffic'
          git push origin HEAD:feature/span-sensor
