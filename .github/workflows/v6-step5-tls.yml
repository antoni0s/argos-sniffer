name: V6 step 5 - multi-port TLS and DoT gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step5_patch.py'
      - '.github/workflows/v6-step5-tls.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step5_patch.py

      - name: TLS BPF functional matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf
          /tmp/test-dynamic-bpf

      - name: TLS policy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ports = Path('src/argos_tls_ports.h').read_text()
          src = Path('src/argos-sniffer.c').read_text()
          bpf = Path('src/argos_bpf.h').read_text()
          for port in ('443U', '465U', '853U', '993U', '995U', '8443U'):
              assert port in ports
          assert '587U' not in ports
          assert 'argos_tls_tcp_port(dport)' in src
          assert 'dport == 853U' in src and 'DOT|%s|%s|%s|%s|%s|%s%s' in src
          assert 'ARGOS_TLS_TCP_PORTS' in bpf
          assert 'ADD(ud, ud_n, ARGOS_QUIC_UDP_PORT)' in bpf
          # QUIC remains client-direction UDP/443 only.
          assert src.count('(opt_tls && dport == 443U)') == 1
          assert src.count('else if (opt_tls && dport == 443)') == 1
          print('multi-port TLS / DoT invariants: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub
          git diff --check

      - name: Existing parser fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_quic_v2.c -o /tmp/test-quic-v2
          /tmp/test-quic-v2

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c src/argos_bpf.h src/argos_tls_ports.h tests/test_dynamic_bpf.c
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v6): extend TLS fingerprints and classify DoT'
          git push origin HEAD:version-6
