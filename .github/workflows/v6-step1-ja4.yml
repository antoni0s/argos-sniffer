name: V6 step 3 - netlink prefix refresh

on:
  push:
    branches: [version-6]
    paths:
      - '.github/workflows/v6-step1-ja4.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply netlink prefix refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              return s.replace(old, new, 1)

          Path('src/argos_netlink.h').write_text('''#ifndef ARGOS_NETLINK_H\n#define ARGOS_NETLINK_H\n\n#include <stdint.h>\n#include <linux/rtnetlink.h>\n\n/* Address changes are the only route-netlink notifications that invalidate\n * the connected-prefix snapshot used by Argos classification. Link-state\n * churn by itself does not require an expensive getifaddrs() rescan. */\nstatic inline int argos_netlink_prefix_event_type(uint16_t type) {\n    return type == RTM_NEWADDR || type == RTM_DELADDR;\n}\n\n#endif /* ARGOS_NETLINK_H */\n''')

          Path('tests/test_netlink_refresh.c').write_text('''#include <stdio.h>\n#include "../src/argos_netlink.h"\n\nint main(void) {\n    if (!argos_netlink_prefix_event_type(RTM_NEWADDR)) return 1;\n    if (!argos_netlink_prefix_event_type(RTM_DELADDR)) return 2;\n    if (argos_netlink_prefix_event_type(RTM_NEWLINK)) return 3;\n    if (argos_netlink_prefix_event_type(RTM_DELLINK)) return 4;\n    if (argos_netlink_prefix_event_type(NLMSG_NOOP)) return 5;\n    puts("netlink prefix event classifier: PASS");\n    return 0;\n}\n''')

          p = Path('src/argos-sniffer.c')
          s = p.read_text()

          old_inc = '''#include "argos_enterprise.h"\n'''
          new_inc = '''#include "argos_enterprise.h"\n#ifndef ARGOS_PORTABLE_TEST\n#include "argos_netlink.h"\n#endif\n'''
          s = replace_once(s, old_inc, new_inc, 'netlink header include')

          old_prefix_end = '''    freeifaddrs(ifa);\n    fprintf(stderr, "argos: learned %d LAN prefix(es) from captured interfaces\\n", lan_pfx_count);\n}\n#endif\n\nstatic int is_lan_ipv4(uint32_t ip_be) {\n'''
          new_prefix_end = '''    freeifaddrs(ifa);\n    fprintf(stderr, "argos: learned %d LAN prefix(es) from captured interfaces\\n", lan_pfx_count);\n}\n\n/* Route-netlink is integrated into the same epoll loop as AF_PACKET capture.\n * The socket subscribes only to IPv4/IPv6 address changes. A readable burst is\n * drained completely and collapsed into one getifaddrs() refresh, keeping this\n * work out of the per-packet hot path. */\nstatic unsigned char lan_netlink_epoll_tag;\n\nstatic int lan_netlink_open(void) {\n    int fd = socket(AF_NETLINK, SOCK_RAW | SOCK_NONBLOCK | SOCK_CLOEXEC, NETLINK_ROUTE);\n    if (fd < 0) return -1;\n\n    struct sockaddr_nl addr;\n    memset(&addr, 0, sizeof(addr));\n    addr.nl_family = AF_NETLINK;\n    addr.nl_groups = RTMGRP_IPV4_IFADDR | RTMGRP_IPV6_IFADDR;\n    if (bind(fd, (struct sockaddr *)&addr, sizeof(addr)) < 0) {\n        int saved_errno = errno;\n        close(fd);\n        errno = saved_errno;\n        return -1;\n    }\n    return fd;\n}\n\nstatic int lan_netlink_drain(int fd) {\n    int refresh = 0;\n    unsigned char buf[8192];\n\n    for (;;) {\n        ssize_t n = recv(fd, buf, sizeof(buf), MSG_DONTWAIT);\n        if (n < 0) {\n            if (errno == EINTR) continue;\n            if (errno == EAGAIN || errno == EWOULDBLOCK) break;\n            /* ENOBUFS means notifications may have been dropped. Force a\n             * full resnapshot so stale prefixes cannot persist silently. */\n            if (errno == ENOBUFS) refresh = 1;\n            break;\n        }\n        if (n == 0) break;\n\n        int rem = (int)n;\n        for (struct nlmsghdr *nh = (struct nlmsghdr *)buf; NLMSG_OK(nh, rem);\n             nh = NLMSG_NEXT(nh, rem)) {\n            if (nh->nlmsg_type == NLMSG_ERROR) {\n                refresh = 1;\n                continue;\n            }\n            if (argos_netlink_prefix_event_type((uint16_t)nh->nlmsg_type)) refresh = 1;\n        }\n    }\n    return refresh;\n}\n#endif\n\nstatic int is_lan_ipv4(uint32_t ip_be) {\n'''
          s = replace_once(s, old_prefix_end, new_prefix_end, 'netlink helpers')

          old_epoll = '''    int epoll_fd = epoll_create1(0);\n    if (epoll_fd < 0) { perror("epoll_create1"); return 1; }\n'''
          new_epoll = '''    int epoll_fd = epoll_create1(0);\n    if (epoll_fd < 0) { perror("epoll_create1"); return 1; }\n    int lan_netlink_fd = -1;\n'''
          s = replace_once(s, old_epoll, new_epoll, 'netlink fd declaration')

          old_start = '''    if (num_ifaces == 0) { fprintf(stderr, "No valid interfaces bound. Exiting.\\n"); return 1; }\n    learn_lan_prefixes();\n    /* Keep stdout line-buffered whenever it is active. With -U it is a\n'''
          new_start = '''    if (num_ifaces == 0) { fprintf(stderr, "No valid interfaces bound. Exiting.\\n"); return 1; }\n    learn_lan_prefixes();\n\n    lan_netlink_fd = lan_netlink_open();\n    if (lan_netlink_fd >= 0) {\n        struct epoll_event nev;\n        memset(&nev, 0, sizeof(nev));\n        nev.events = EPOLLIN;\n        nev.data.ptr = &lan_netlink_epoll_tag;\n        if (epoll_ctl(epoll_fd, EPOLL_CTL_ADD, lan_netlink_fd, &nev) < 0) {\n            fprintf(stderr, "warning: unable to add route-netlink listener to epoll: %s\\n", strerror(errno));\n            close(lan_netlink_fd);\n            lan_netlink_fd = -1;\n        }\n    } else {\n        fprintf(stderr, "warning: route-netlink prefix refresh unavailable: %s\\n", strerror(errno));\n    }\n\n    /* Keep stdout line-buffered whenever it is active. With -U it is a\n'''
          s = replace_once(s, old_start, new_start, 'netlink epoll registration')

          old_event = '''        for (int i = 0; i < nfds; i++) {\n            capture_iface_t *current_iface = (capture_iface_t *)events[i].data.ptr;\n\n            struct sockaddr_ll from_ll;\n'''
          new_event = '''        for (int i = 0; i < nfds; i++) {\n            if (events[i].data.ptr == &lan_netlink_epoll_tag) {\n                if (lan_netlink_fd >= 0 && lan_netlink_drain(lan_netlink_fd))\n                    learn_lan_prefixes();\n                continue;\n            }\n\n            capture_iface_t *current_iface = (capture_iface_t *)events[i].data.ptr;\n\n            struct sockaddr_ll from_ll;\n'''
          s = replace_once(s, old_event, new_event, 'netlink epoll dispatch')

          old_cleanup = '''    for (int i = 0; i < num_ifaces; i++) close(active_ifaces[i].fd);\n    if (ipc_sock >= 0) close(ipc_sock);\n'''
          new_cleanup = '''    for (int i = 0; i < num_ifaces; i++) close(active_ifaces[i].fd);\n    if (lan_netlink_fd >= 0) close(lan_netlink_fd);\n    if (ipc_sock >= 0) close(ipc_sock);\n'''
          s = replace_once(s, old_cleanup, new_cleanup, 'netlink cleanup')

          p.write_text(s)
          PY

      - name: Netlink event classifier fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/test_netlink_refresh.c -o /tmp/test-netlink-refresh
          /tmp/test-netlink-refresh

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub
          git diff --check

      - name: Structural netlink checks
        run: |
          grep -F 'NETLINK_ROUTE' src/argos-sniffer.c
          grep -F 'RTMGRP_IPV4_IFADDR | RTMGRP_IPV6_IFADDR' src/argos-sniffer.c
          grep -F 'lan_netlink_drain(lan_netlink_fd)' src/argos-sniffer.c
          grep -F 'if (lan_netlink_fd >= 0) close(lan_netlink_fd);' src/argos-sniffer.c
          ! grep -F 'RTMGRP_LINK' src/argos-sniffer.c

      - name: Commit tested netlink refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c src/argos_netlink.h tests/test_netlink_refresh.c
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v6): refresh LAN prefixes from route netlink'
          git push origin HEAD:version-6
