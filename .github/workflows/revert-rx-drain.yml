name: Validate corrective Argos Sniffer v5.3.1 receive loop

on:
  push:
    branches:
      - feature/span-sensor
    paths:
      - .github/workflows/revert-rx-drain.yml

permissions:
  contents: write

jobs:
  revert-rx-drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/span-sensor

      - name: Restore single-packet epoll receive path
        shell: bash
        run: |
          grep -q '#define VERSION "5.3.1"' src/argos-sniffer.c
          sed -i '/#define RX_DRAIN_BUDGET 64/d' src/argos-sniffer.c
          python3 -c 'from pathlib import Path; p=Path("src/argos-sniffer.c"); s=p.read_text(); old="            /* Drain a bounded number of queued AF_PACKET frames per readiness\n             * event. Level-triggered epoll reports the fd again if data remains;\n             * the budget preserves fairness across interfaces and maintenance. */\n            for (int rx = 0; rx < RX_DRAIN_BUDGET && running; rx++) {\n"; assert s.count(old)==1; p.write_text(s.replace(old,"",1))'
          python3 -c 'from pathlib import Path; p=Path("src/argos-sniffer.c"); s=p.read_text(); old="            ssize_t len = recvmsg(current_iface->fd, &msg, MSG_TRUNC | MSG_DONTWAIT);\n            if (len < 0) {\n                if (errno == EAGAIN || errno == EWOULDBLOCK) break;\n                if (errno == EINTR) continue;\n                break;\n            }\n            if (len == 0) break;\n            if ((size_t)len > sizeof(buffer)) len = sizeof(buffer);\n"; new="            ssize_t len = recvmsg(current_iface->fd, &msg, MSG_TRUNC);\n            if (len <= 0) continue;\n            if ((size_t)len > sizeof(buffer)) len = sizeof(buffer);\n"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          sed -i '/} \/\* bounded RX drain \*\//d' src/argos-sniffer.c
          python3 -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(); old="> v5.3.1 improves AF_PACKET microburst handling with a bounded nonblocking receive drain while preserving interface fairness and the existing 1 MiB socket receive buffer."; new="> v5.3.1 keeps the established level-triggered epoll receive path after runtime testing showed that synchronous bounded RX draining increased AF_PACKET drops under burst traffic."; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'

      - name: Strict validation
        shell: bash
        run: |
          git diff --check
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          /tmp/argos-sniffer 2>&1 | grep -q 'argos-sniffer v5.3.1'
          ! grep -q 'RX_DRAIN_BUDGET' src/argos-sniffer.c
          ! grep -q 'MSG_TRUNC | MSG_DONTWAIT' src/argos-sniffer.c
          grep -q 'recvmsg(current_iface->fd, &msg, MSG_TRUNC)' src/argos-sniffer.c

      - name: Commit corrective v5.3.1
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/argos-sniffer.c README.md
          git diff --cached --check
          git commit -m 'Fix 5.3.1: revert RX drain regression'
          git push
