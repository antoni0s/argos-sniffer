name: V6 capture batching benchmark

on:
  push:
    branches: [version-6]
    paths:
      - 'bench/capture_batch_bench.c'
      - '.github/workflows/v6-capture-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-benchmark:
    name: recvmsg vs recvmmsg microbenchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict compile
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror bench/capture_batch_bench.c -o /tmp/capture-bench

      - name: Run five paired trials
        run: |
          /tmp/capture-bench | tee /tmp/capture-bench.csv
          python3 - <<'PY'
          import csv, statistics
          rows=list(csv.DictReader(open('/tmp/capture-bench.csv')))
          by={}
          for r in rows:
              by.setdefault(r['method'],[]).append(float(r['packets_per_sec']))
          print('\nMedian packets/sec (CI runner; directional signal only):')
          med={method:statistics.median(vals) for method,vals in by.items()}
          for method in ('recvmsg','recvmmsg4','recvmmsg8','recvmmsg16','recvmmsg32'):
              if method in med:
                  print(f'{method}: {med[method]:.0f} pps')
          if 'recvmsg' in med:
              base=med['recvmsg']
              print('\nMedian ratios vs recvmsg:')
              for method in ('recvmmsg4','recvmmsg8','recvmmsg16','recvmmsg32'):
                  if method in med:
                      print(f'{method}: {med[method]/base:.3f}x')
          print('No pass/fail threshold is applied: hosted-runner timing is intentionally non-gating.')
          PY

      - name: Benchmark contract invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('bench/capture_batch_bench.c').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          c=Path('src/argos_capture.h').read_text()
          assert 'recvmsg(iface->fd, &msg, MSG_TRUNC)' in c
          assert 'epoll_wait(capture.epoll_fd' in s
          assert 'argos_capture_receive(current_iface, buffer' in s
          assert 'BENCH_MAX_BATCH 32U' in b
          assert '{4U, 8U, 16U, 32U}' in b
          assert 'recvmmsg(' in b and 'recvmsg(' in b
          assert 'SO_TIMESTAMPNS' in b
          assert 'MSG_TRUNC' in b
          assert 'MSG_TRUNC' in c and 'recvmmsg(' not in c
          print('Capture benchmark contract invariants: PASS')
          PY
