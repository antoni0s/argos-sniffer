name: V6 step 12d - SMB NTLM privacy gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step12d_ntlm_privacy.py'
      - '.github/workflows/v6-step12d-ntlm-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ntlm-privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged NTLM privacy patch
        run: python3 .github/scripts/v6_step12d_ntlm_privacy.py

      - name: NTLM privacy fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_ntlm_privacy.c -o /tmp/test-ntlm-privacy
          /tmp/test-ntlm-privacy

      - name: NTLM privacy sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_ntlm_privacy.c -o /tmp/test-ntlm-privacy-san
          /tmp/test-ntlm-privacy-san

      - name: Privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e=Path('src/argos_enterprise.h').read_text()
          t=Path('tests/test_ntlm_privacy.c').read_text()
          assert 'domain_present=%u domain_len=%u domain_hash=%08x' in e
          assert 'workstation_present=%u workstation_len=%u workstation_hash=%08x' in e
          assert ' domain=%s' not in e and ' workstation=%s' not in e
          assert 'SECRET-CORP' in t and 'ALICE-PC' in t
          assert 'strstr(r.detail,domain)==NULL' in t
          assert 'strstr(r.detail,workstation)==NULL' in t
          print('NTLM privacy invariants: PASS')
          PY

      - name: Existing enterprise and identity fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_framework.c -o /tmp/test-identity-framework
          /tmp/test-identity-framework
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_rdp.c -o /tmp/test-identity-rdp
          /tmp/test-identity-rdp

      - name: Strict full and stub builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

      - name: Commit production privacy fix only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos_enterprise.h tests/test_ntlm_privacy.c
          git diff --cached --quiet && exit 0
          git commit -m "fix(v6): redact SMB NTLM identity metadata"
          git push origin HEAD:version-6
