name: Bump Argos version to 5.3.1

on:
  push:
    branches:
      - feature/span-sensor
    paths:
      - .github/workflows/bump-v531.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/span-sensor
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/argos-sniffer.c')
          s = p.read_text()
          assert s.count('#define VERSION "5.3.0"') == 1
          s = s.replace('#define VERSION "5.3.0"', '#define VERSION "5.3.1"', 1)
          anchor = '#define MAX_EPOLL_EVENTS 16\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + '#define RX_DRAIN_BUDGET 64  /* bounded AF_PACKET drain per epoll readiness event */\n', 1)
          old = '        for (int i = 0; i < nfds; i++) {\n            capture_iface_t *current_iface = (capture_iface_t *)events[i].data.ptr;\n\n            struct sockaddr_ll from_ll;\n'
          new = '        for (int i = 0; i < nfds; i++) {\n            capture_iface_t *current_iface = (capture_iface_t *)events[i].data.ptr;\n\n            /* Drain a bounded number of queued AF_PACKET frames per readiness\n             * event. Level-triggered epoll reports the fd again if data remains;\n             * the budget preserves fairness across interfaces and maintenance. */\n            for (int rx = 0; rx < RX_DRAIN_BUDGET && running; rx++) {\n            struct sockaddr_ll from_ll;\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '            ssize_t len = recvmsg(current_iface->fd, &msg, MSG_TRUNC);\n            if (len <= 0) continue;\n            if ((size_t)len > sizeof(buffer)) len = sizeof(buffer);\n'
          new = '            ssize_t len = recvmsg(current_iface->fd, &msg, MSG_TRUNC | MSG_DONTWAIT);\n            if (len < 0) {\n                if (errno == EAGAIN || errno == EWOULDBLOCK) break;\n                if (errno == EINTR) continue;\n                break;\n            }\n            if (len == 0) break;\n            if ((size_t)len > sizeof(buffer)) len = sizeof(buffer);\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '                else if (opt_tls && dport == 443) {\n                    parse_quic(payload, payload_len, mac_str, src_ip_str, dst_ip_str, dport, routed_str, opt_tls_rl);\n                }\n            }\n        }\n        if (opt_v6) {\n'
          new = '                else if (opt_tls && dport == 443) {\n                    parse_quic(payload, payload_len, mac_str, src_ip_str, dst_ip_str, dport, routed_str, opt_tls_rl);\n                }\n            }\n            } /* bounded RX drain */\n        }\n        if (opt_v6) {\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Compile check
        run: |
          git diff --check
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          /tmp/argos-sniffer --help | grep -q 'argos-sniffer v5.3.1'
          grep -q 'RX_DRAIN_BUDGET 64' src/argos-sniffer.c
          grep -q 'MSG_TRUNC | MSG_DONTWAIT' src/argos-sniffer.c
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/argos-sniffer.c
          git commit -m 'Release 5.3.1: improve AF_PACKET burst handling'
          git push
