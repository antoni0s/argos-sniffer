name: Finalize Argos Sniffer v5.3.1

on:
  push:
    branches:
      - feature/span-sensor
    paths:
      - .github/workflows/bump-v531.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/span-sensor
      - name: Update release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = '**Current development release: 5.3.0**'
          assert s.count(old) == 1
          s = s.replace(old, '**Current development release: 5.3.1**', 1)
          old = '> v5.3.0 adds native SPAN/TAP sensor operation while preserving the existing gateway mode and legacy telemetry format by default.'
          assert s.count(old) == 1
          new = '> v5.3.1 improves AF_PACKET microburst handling with a bounded nonblocking receive drain while preserving interface fairness and the existing 1 MiB socket receive buffer.\n>\n> v5.3.0 added native SPAN/TAP sensor operation while preserving the existing gateway mode and legacy telemetry format by default.'
          p.write_text(s.replace(old, new, 1))
          p = Path('.github/workflows/build-sensor.yml')
          s = p.read_text()
          assert 'v5.3.0' in s
          p.write_text(s.replace('v5.3.0', 'v5.3.1'))
          PY
      - name: Validate v5.3.1
        run: |
          git diff --check
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          /tmp/argos-sniffer --help | grep -q 'argos-sniffer v5.3.1'
          grep -q 'Current development release: 5.3.1' README.md
          grep -q 'Build Argos Sensor v5.3.1' .github/workflows/build-sensor.yml
      - name: Commit metadata and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/bump-v531.yml
          git add README.md .github/workflows/build-sensor.yml
          git diff --cached --check
          git commit -m 'Finalize Argos Sniffer v5.3.1 metadata'
          git push
