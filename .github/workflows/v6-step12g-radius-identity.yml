name: V6 step 12g - RADIUS identity gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step12g_radius_identity.py'
      - '.github/workflows/v6-step12g-radius-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radius-identity-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged RADIUS identity patch
        run: python3 .github/scripts/v6_step12g_radius_identity.py

      - name: RADIUS Access-Request identity fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_radius.c -o /tmp/test-identity-radius
          /tmp/test-identity-radius

      - name: RADIUS identity sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_identity_radius.c -o /tmp/test-identity-radius-san
          /tmp/test-identity-radius-san

      - name: RADIUS privacy and scope invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_identity.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          e=Path('src/argos_enterprise.h').read_text()
          t=Path('tests/test_identity_radius.c').read_text()
          checks={
            'extractor': 'argos_identity_radius_access_request' in h,
            'access request only': 'p[0] != 1U' in h and 'Access-Request only' in h,
            'username attr only': 'if (type == 1U)' in h,
            'sensitive scope': 'User-Password, CHAP-Password, State, EAP-Message' in h and 'Message-Authenticator' in h,
            'UDP 1812 only': 'if (opt_identity && dport == 1812U)' in s,
            'no accounting identity': 'dport == 1813U' not in s[s.find('RADIUS observed identity'):s.find('UDP/88 uses')],
            'fixture secrets absent prod': all(x not in h and x not in s for x in ('PW-SECRET','STATE-SECRET','AUTH-SECRET')),
            'fixture secrets exercised': all(x in t for x in ('PW-SECRET','STATE-SECRET','AUTH-SECRET')),
            'ENT still redacted': 'User-Name, Calling/Called-Station-Id' in e and 'user_present=%u password_attr=%u' in e,
            'ENT no raw username': ' username=%s' not in e and ' user=%s' not in e,
          }
          bad=[k for k,v in checks.items() if not v]
          assert not bad, 'failed contracts: '+', '.join(bad)
          print('RADIUS identity privacy/scope invariants: PASS')
          PY

      - name: Existing identity and enterprise regressions
        run: |
          for f in tests/test_identity_framework.c tests/test_identity_rdp.c tests/test_identity_ntlm.c tests/test_identity_kerberos.c tests/test_ntlm_privacy.c tests/test_ntlm_flow_completion.c tests/test_enterprise.c; do
            out="/tmp/$(basename "$f" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$f" -o "$out"
            "$out"
          done

      - name: Strict full and stub builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

      - name: Commit production extractor only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos_identity.h src/argos-sniffer.c tests/test_identity_radius.c
          git diff --cached --quiet && exit 0
          git commit -m "feat(v6): extract bounded RADIUS Access-Request observed identity"
          git push origin HEAD:version-6
