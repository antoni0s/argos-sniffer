name: Validate pure-ACK kernel prefilter

on:
  push:
    branches:
      - feature/span-sensor
    paths:
      - .github/workflows/pure-ack-prefilter-test.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/span-sensor
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/patch-pure-ack.py

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q '#define VERSION "5.3.1"' src/argos-sniffer.c
          grep -q 'Drop zero-payload ACK/window-update traffic in-kernel' src/argos-sniffer.c
          grep -q 'BPF_JGT | BPF_X' src/argos-sniffer.c
          grep -q 'int rcvbuf = 2 \* 1024 \* 1024' src/argos-sniffer.c
          grep -q 'recvmsg(current_iface->fd, &msg, MSG_TRUNC)' src/argos-sniffer.c
          ! grep -q 'RX_DRAIN_BUDGET' src/argos-sniffer.c
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          strings /tmp/argos-sniffer | grep -q '5.3.1'
          IFACE=$(ip -o link show | awk -F': ' '$2 != "lo" {split($2,a,"@"); print a[1]; exit}')
          test -n "$IFACE"
          set +e
          sudo timeout 2 /tmp/argos-sniffer -i "$IFACE" -s -q -t -h -l -v >/dev/null 2>/tmp/argos-smoke.err
          RC=$?
          set -e
          test "$RC" -eq 124 -o "$RC" -eq 0
          ! grep -q 'unable to attach AF_PACKET prefilter' /tmp/argos-smoke.err

      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c
          git commit -m 'Experiment 5.3.1: drop zero-payload TCP ACKs in kernel prefilter'
          git push origin HEAD:feature/span-sensor
