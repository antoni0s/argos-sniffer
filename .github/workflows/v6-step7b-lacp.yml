name: V6 step 7b - LACP gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step7b_patch.py'
      - '.github/workflows/v6-step7b-lacp.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step7b_patch.py

      - name: LACP fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_lacp.c -o /tmp/test-lacp
          /tmp/test-lacp

      - name: Dynamic BPF matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf
          /tmp/test-dynamic-bpf

      - name: LACP integration invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('src/argos-sniffer.c').read_text()
          bpf=Path('src/argos_bpf.h').read_text()
          lacp=Path('src/argos_lacp.h').read_text()
          assert 'p[0] != 0x01U' in lacp
          assert 'p[2] != 0x01U || p[3] != 0x14U' in lacp
          assert 'p[22] != 0x02U || p[23] != 0x14U' in lacp
          assert 'EMIT(abpf_pass_ethertype(p, 0x8809)); /* Slow Protocols / LACP */' in bpf
          assert 'ENT|%s|-|-|LACP|%s' in src
          assert src.count('l3_proto == 0x8809U') >= 3
          print('LACP integration invariants: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub
          git diff --check

      - name: LACP sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_lacp.c -o /tmp/test-lacp-san
          /tmp/test-lacp-san

      - name: Existing regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_lldp_med.c -o /tmp/test-lldp-med
          /tmp/test-lldp-med
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_tls_server.c -o /tmp/test-tlssrv
          /tmp/test-tlssrv

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c src/argos_bpf.h src/argos_lacp.h tests/test_dynamic_bpf.c tests/test_lacp.c
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v6): fingerprint LACP actor and partner state'
          git push origin HEAD:version-6
