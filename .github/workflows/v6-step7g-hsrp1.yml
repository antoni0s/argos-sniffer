name: V6 step 7g - HSRPv1 gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step7g_hsrp1_patch.py'
      - '.github/workflows/v6-step7g-hsrp1.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0
      - name: Apply staged patch
        run: python3 .github/scripts/v6_step7g_hsrp1_patch.py
      - name: HSRPv1 fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_hsrp1.c -o /tmp/test-hsrp1
          /tmp/test-hsrp1
      - name: Dynamic BPF matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf
          /tmp/test-dynamic-bpf
      - name: HSRPv1 integration/privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('src/argos-sniffer.c').read_text(); hdr=Path('src/argos_hsrp.h').read_text(); ports=Path('src/argos_enterprise_ports.h').read_text()
          assert 'ttl == 1U && (sport == 1985U || dport == 1985U)' in src
          assert 'ENT|%s|%s|%s|HSRP|%s%s' in src
          assert '623, 1985, 2049' in ports
          assert 'cleartext authentication field and' in hdr
          assert 'wire Version=0' in hdr
          print('HSRPv1 integration/privacy invariants: PASS')
          PY
      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub
          git diff --check
      - name: HSRPv1 sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_hsrp1.c -o /tmp/test-hsrp1-san
          /tmp/test-hsrp1-san
      - name: Existing enterprise regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_vrrp.c -o /tmp/test-vrrp && /tmp/test-vrrp
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise && /tmp/test-enterprise
      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c src/argos_hsrp.h src/argos_enterprise_ports.h tests/test_hsrp1.c
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v6): fingerprint HSRPv1 redundancy state'
          git push origin HEAD:version-6
