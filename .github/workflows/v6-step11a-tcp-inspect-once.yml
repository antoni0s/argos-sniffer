name: V6 step 11a - TCP inspect-once hardening

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step11a_tcp_inspect_once_patch.py'
      - '.github/workflows/v6-step11a-tcp-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step11a_tcp_inspect_once_patch.py

      - name: TCP inspect-once fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_app_flow.c -lm -o /tmp/test-app-flow
          /tmp/test-app-flow

      - name: Inspect-once invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/argos-sniffer.c').read_text()
          assert 'app_flow_reset_pair' in s
          assert 'if (tcp->syn && !tcp->ack)' in s
          assert 'app_flow_reset_pair(flow_ip_version' in s
          assert 'if (ent_tcp_seen && ent_tcp.complete) fingerprint_complete = 1;' in s
          assert 'APP_FLOW_PACKET_BUDGET 8' in s
          assert 'A fresh TCP SYN starts a new connection' in s
          print('TCP inspect-once invariants: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub

      - name: Inspect-once sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_app_flow.c -lm -o /tmp/test-app-flow-san
          /tmp/test-app-flow-san

      - name: Existing regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise && /tmp/test-enterprise
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_mqtt.c -o /tmp/test-mqtt && /tmp/test-mqtt
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_wireguard.c -o /tmp/test-wireguard && /tmp/test-wireguard
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dns_track.c -o /tmp/test-dns-track && /tmp/test-dns-track

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c tests/test_app_flow.c
          git commit -m 'fix(v6): reset inspect-once state on new TCP SYN'
          git push origin HEAD:version-6
