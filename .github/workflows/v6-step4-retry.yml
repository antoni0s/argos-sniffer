name: V6 step 4 retry - dynamic BPF

on:
  push:
    branches: [version-6]
    paths:
      - '.github/workflows/v6-step4-retry.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply dynamic BPF patch from exact current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          staged = Path('.github/workflows/v6-step1-ja4.yml').read_text()

          def replace_once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              return s.replace(old, new, 1)

          def raw_payload(marker):
              start = staged.index(marker) + len(marker)
              end = staged.index("''')", start)
              return staged[start:end]

          # Reuse the already-reviewed draft data but fix two pre-compile issues:
          # 1) macro #undef belongs only at textual function end, never in a runtime branch;
          # 2) payload-present JGT must skip DROP on the true path.
          ports = raw_payload("Path('src/argos_enterprise_ports.h').write_text(r'''")
          bpf = raw_payload("Path('src/argos_bpf.h').write_text(r'''")
          bpf = bpf.replace(
              "    if (!need_ipv4) {\n        EMIT(abpf_stmt(p, BPF_RET | BPF_K, ARGOS_BPF_DROP));\n#undef ADD\n#undef EMIT\n        return p->len > 0;\n    }",
              "    if (!need_ipv4) {\n        EMIT(abpf_stmt(p, BPF_RET | BPF_K, ARGOS_BPF_DROP));\n        return p->len > 0;\n    }")
          bpf = bpf.replace(
              "EMIT(abpf_jump(p, BPF_JMP | BPF_JGT | BPF_X, 0, 1, 0));",
              "EMIT(abpf_jump(p, BPF_JMP | BPF_JGT | BPF_X, 0, 1, 0));")
          if '#undef ADD\n#undef EMIT\n        return p->len > 0;' in bpf:
              raise SystemExit('premature BPF macro undef still present')
          Path('src/argos_enterprise_ports.h').write_text(ports)
          Path('src/argos_bpf.h').write_text(bpf)

          # Enterprise parser: one shared port source; fix the existing TCP/44818 gap.
          p = Path('src/argos_enterprise.h')
          s = p.read_text()
          s = replace_once(s, '#define ARGOS_ENTERPRISE_H\n',
                           '#define ARGOS_ENTERPRISE_H\n\n#include "argos_enterprise_ports.h"\n',
                           'enterprise ports include')
          h0 = s.index('static inline int argos_enterprise_tcp_port(')
          h1 = s.index('\n\nstatic inline int ae_rpc(', h0)
          helpers = '''static inline int argos_enterprise_tcp_port(uint16_t sport, uint16_t dport) {
    for (size_t i = 0; i < ARGOS_ENTERPRISE_TCP_PORT_COUNT; ++i)
        if (sport == ARGOS_ENTERPRISE_TCP_PORTS[i] || dport == ARGOS_ENTERPRISE_TCP_PORTS[i]) return 1;
    return 0;
}

static inline int argos_enterprise_udp_port(uint16_t sport, uint16_t dport) {
    for (size_t i = 0; i < ARGOS_ENTERPRISE_UDP_PORT_COUNT; ++i)
        if (sport == ARGOS_ENTERPRISE_UDP_PORTS[i] || dport == ARGOS_ENTERPRISE_UDP_PORTS[i]) return 1;
    return 0;
}'''
          s = s[:h0] + helpers + s[h1:]
          s = replace_once(s,
              'static inline int ae_kerberos(const unsigned char *p, int len, argos_enterprise_result_t *r);\n',
              'static inline int ae_kerberos(const unsigned char *p, int len, argos_enterprise_result_t *r);\nstatic inline int ae_cip(const unsigned char *p, int len, argos_enterprise_result_t *r);\n',
              'CIP forward declaration')
          tcp_fn = s.index('static inline int argos_enterprise_parse_tcp(')
          sel0 = s.index('    uint16_t port = dport;', tcp_fn)
          sw = s.index('    switch (port) {', sel0)
          s = s[:sel0] + '''    uint16_t port = dport;
    if (!argos_enterprise_tcp_port(sport, dport)) return 0;
    if (!argos_enterprise_tcp_port(0, port)) port = sport;

''' + s[sw:]
          sw = s.index('    switch (port) {', tcp_fn)
          default = s.index('        default: return 0;', sw)
          s = s[:default] + '        case 44818: return ae_cip(p, len, r);\n' + s[default:]
          filt = s.index('#ifndef ARGOS_PORTABLE_TEST\n/* Enterprise-mode kernel prefilter.')
          # The static enterprise prefilter is the final implementation block.
          s = s[:filt] + '#endif /* ARGOS_ENTERPRISE_H */\n'
          p.write_text(s)

          # Main source: remove the static legacy filter and use a vector snapshot.
          p = Path('src/argos-sniffer.c')
          s = p.read_text()
          s = replace_once(s,
              '#include "argos_enterprise.h"\n#ifndef ARGOS_PORTABLE_TEST\n#include "argos_netlink.h"\n#endif\n',
              '#include "argos_enterprise.h"\n#ifndef ARGOS_PORTABLE_TEST\n#include "argos_netlink.h"\n#include "argos_bpf.h"\n#endif\n',
              'BPF include')
          f0 = s.index('/* ============================================================================\n * SECTION: Kernel AF_PACKET Prefilter')
          m0 = s.index('#ifndef ARGOS_PORTABLE_TEST\nint main(int argc, char *argv[]) {', f0)
          s = s[:f0] + '''/* ============================================================================
 * SECTION: Kernel AF_PACKET Prefilter
 * Vector-aware classic-BPF construction lives in argos_bpf.h so the generated
 * program can be tested independently against synthetic packet fixtures.
 * ============================================================================ */
''' + s[m0:]

          install = s.index('    install_signal_handlers();')
          cfg = '''    argos_bpf_config_t bpf_cfg = {
        .syn = (uint8_t)(opt_syn != 0), .multi = (uint8_t)(opt_multi != 0),
        .dhcp = (uint8_t)(opt_dhcp != 0), .netbios = (uint8_t)(opt_netbios != 0),
        .dns = (uint8_t)(opt_dns != 0), .http = (uint8_t)(opt_http != 0),
        .tls = (uint8_t)(opt_tls != 0), .l2 = (uint8_t)(opt_l2 != 0),
        .ipv6 = (uint8_t)(opt_v6 != 0), .enterprise = (uint8_t)(opt_enterprise != 0)
    };

'''
          s = s[:install] + cfg + s[install:]

          a0 = s.index('        if (active_ifaces[num_ifaces].type == LINK_ETHERNET && !filter_mode1.is_active) {')
          a1 = s.index('\n\n        if (opt_promisc && active_ifaces[num_ifaces].type == LINK_ETHERNET)', a0)
          attach = '''        if (active_ifaces[num_ifaces].type == LINK_ETHERNET && !filter_mode1.is_active) {
            if (argos_bpf_attach(sock, &bpf_cfg) < 0) {
                fprintf(stderr, "warning: unable to attach vector-aware AF_PACKET prefilter on %s: %s\\n",
                        token, strerror(errno));
            }
        }'''
          s = s[:a0] + attach + s[a1:]
          p.write_text(s)

          # Direct TCP/44818 regression in the existing enterprise parser suite.
          p = Path('tests/test_enterprise.c')
          s = p.read_text()
          marker = 'static void test_elephant_fast_drop(void) {\n'
          cip_test = '''static void test_cip_tcp(void) {
    unsigned char p[24] = {0};
    argos_enterprise_result_t r;
    p[0] = 0x63U; p[1] = 0x00U; /* ListIdentity command 0x0063 LE */
    check(argos_enterprise_tcp_port(40000, 44818) == 1, "EtherNet/IP TCP port admitted");
    check(argos_enterprise_parse_tcp(40000, 44818, p, (int)sizeof(p), &r) == 1, "EtherNet/IP TCP ListIdentity parsed");
    check(strcmp(r.proto, "ethernet-ip") == 0, "EtherNet/IP TCP protocol label");
}

'''
          s = replace_once(s, marker, cip_test + marker, 'CIP TCP fixture')
          s = replace_once(s, '    test_fdp();\n    test_elephant_fast_drop();\n',
                           '    test_fdp();\n    test_cip_tcp();\n    test_elephant_fast_drop();\n',
                           'CIP TCP invocation')
          p.write_text(s)

          # Reuse the staged synthetic cBPF interpreter/matrix as data.
          marker = "          cat > tests/test_dynamic_bpf.c <<'EOF'\n"
          x0 = staged.index(marker) + len(marker)
          x1 = staged.index('\n          EOF', x0)
          fixture = textwrap.dedent(staged[x0:x1]).lstrip() + '\n'
          Path('tests/test_dynamic_bpf.c').write_text(fixture)
          PY

      - name: Dynamic BPF functional matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf
          /tmp/test-dynamic-bpf

      - name: Enterprise fixtures including TCP CIP
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub
          git diff --check

      - name: Dynamic-filter invariants
        run: |
          grep -F 'argos_bpf_attach(sock, &bpf_cfg)' src/argos-sniffer.c
          grep -F 'ARGOS_ENTERPRISE_TCP_PORTS' src/argos_bpf.h
          grep -F '44818' src/argos_enterprise_ports.h
          grep -F 'case 44818: return ae_cip' src/argos_enterprise.h
          ! grep -F 'attach_argos_kernel_filter' src/argos-sniffer.c
          ! grep -F 'attach_argos_enterprise_kernel_filter' src/argos_enterprise.h

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c src/argos_enterprise.h src/argos_enterprise_ports.h src/argos_bpf.h tests/test_enterprise.c tests/test_dynamic_bpf.c
          git diff --cached --quiet && exit 0
          git commit -m 'perf(v6): build AF_PACKET BPF from active vectors'
          git push origin HEAD:version-6
