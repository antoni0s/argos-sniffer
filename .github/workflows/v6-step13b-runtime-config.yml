name: V6 step 13b - runtime config gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step13b_runtime_config.py'
      - '.github/workflows/v6-step13b-runtime-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged runtime config refactor
        run: python3 .github/scripts/v6_step13b_runtime_config.py

      - name: Runtime config fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_runtime_config.c -o /tmp/test-runtime-config
          /tmp/test-runtime-config

      - name: Runtime config sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_runtime_config.c -o /tmp/test-runtime-config-san
          /tmp/test-runtime-config-san

      - name: Config architecture invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('src/argos-sniffer.c').read_text()
          c=Path('src/argos_config.h').read_text()
          checks={
            'runtime struct': 'typedef struct {' in c and 'enterprise_enabled' in c and 'wireguard_port' in c,
            'single runtime local': 'argos_runtime_config_t runtime_cfg' in s,
            'central init': 'argos_runtime_config_init(&runtime_cfg)' in s,
            'central validation': 'argos_runtime_config_validate(&runtime_cfg)' in s,
            'enterprise helper': s.count('argos_runtime_enable_enterprise(&runtime_cfg')==2,
            'no old enterprise local': re.search(r'\bopt_enterprise\b',s) is None,
            'no old RL local': re.search(r'\bopt_enterprise_rl\b',s) is None,
            'no old WG local': re.search(r'\bopt_wireguard_port\b',s) is None,
            'identity still one mode': 'runtime_cfg.identity_mode' in s,
            'no wire behavior change': s.count('emit_telemetry("IDENT|%s|%s|%s|%s|%s%s\\n"')==1,
          }
          bad=[k for k,v in checks.items() if not v]
          assert not bad, 'failed contracts: '+', '.join(bad)
          print('runtime config architecture invariants: PASS')
          PY

      - name: CLI compatibility
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub
          set +e
          /tmp/argos-sniffer-stub --identity >/tmp/id.out 2>/tmp/id.err; idrc=$?
          /tmp/argos-sniffer-stub --wireguard-port 44444 >/tmp/wg.out 2>/tmp/wg.err; wgrc=$?
          /tmp/argos-sniffer-stub --identity=unsafe --enterprise >/tmp/bad.out 2>/tmp/bad.err; badrc=$?
          set -e
          test "$idrc" -ne 0 && test "$wgrc" -ne 0 && test "$badrc" -ne 0
          grep -F -- '--identity requires --enterprise or --enterprise-verbose' /tmp/id.err
          grep -F -- '--wireguard-port requires --enterprise or --enterprise-verbose' /tmp/wg.err
          grep -F -- '--identity expects hash or raw' /tmp/bad.err

      - name: Existing config identity and network regressions
        run: |
          for f in \
            tests/test_identity_config.c \
            tests/test_identity_framework.c \
            tests/test_identity_rdp.c \
            tests/test_identity_ntlm.c \
            tests/test_identity_kerberos.c \
            tests/test_identity_radius.c \
            tests/test_ntlm_flow_completion.c \
            tests/test_wireguard.c \
            tests/test_dynamic_bpf.c \
            tests/test_enterprise.c; do
            out="/tmp/$(basename "$f" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$f" -o "$out"
            "$out"
          done

      - name: Strict full and stub builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub2

      - name: Commit refactor only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos_config.h src/argos-sniffer.c tests/test_runtime_config.c
          git diff --cached --quiet && exit 0
          git commit -m "refactor(v6): consolidate enterprise runtime config"
          git push origin HEAD:version-6
