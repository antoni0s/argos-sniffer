name: V6 step 12a - RDP privacy gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step12a_rdp_privacy.py'
      - '.github/scripts/v6_step12a_rdp_privacy_retry.py'
      - '.github/workflows/v6-step12a-rdp-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp-privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged RDP privacy patch
        run: |
          python3 .github/scripts/v6_step12a_rdp_privacy.py
          python3 .github/scripts/v6_step12a_rdp_privacy_retry.py

      - name: RDP privacy fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise

      - name: RDP privacy sanitizer
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_enterprise.c -o /tmp/test-enterprise-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/test-enterprise-san

      - name: Privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/argos_enterprise.h').read_text()
          t=Path('tests/test_enterprise.c').read_text()
          assert 'cookie_present=%u cookie_len=%u cookie_hash=%08x' in s
          assert 'cookie=%s' not in s
          assert 'c += 17; /* strlen("Cookie: mstshash=") */' in s
          assert 'alice.enterprise.secret' in t
          assert 'strstr(r.detail, secret) == NULL' in t
          assert '2166136261U' in s and '16777619U' in s
          print('RDP privacy invariants: PASS')
          PY

      - name: Strict full and stub builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

      - name: Existing network and identity fixtures
        run: |
          for f in tests/test_mqtt.c tests/test_coap.c tests/test_stun_turn.c tests/test_wireguard.c tests/test_raw_identity.c; do
            [ -f "$f" ] || continue
            out="/tmp/$(basename "$f" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$f" -o "$out"
            "$out"
          done

      - name: Commit production change only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos_enterprise.h tests/test_enterprise.c
          git diff --cached --quiet && exit 0
          git commit -m "fix(v6): redact RDP mstshash metadata"
          git push origin HEAD:version-6
