name: V6 enterprise CI
# Permanent v6 gate: no staging/migration workflows are required.

on:
  push:
    branches: [version-6]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native strict build and parser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict compile - full QUIC
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-full

      - name: Strict compile - QUIC stub
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-stub

      - name: Telemetry engine wire-format regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_telemetry.c -o /tmp/test-telemetry
          /tmp/test-telemetry
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text(); telemetry = Path('src/argos_telemetry.h').read_text()
          assert src.count('#include "argos_telemetry.h"') == 1
          assert 'SECTION: Telemetry Output Engine' not in src
          assert 'static void emit_telemetry(' not in src
          assert 'static int parse_host_port(' not in src
          for symbol in ('emit_telemetry', 'parse_host_port', 'ipc_sock', 'remote_sock',
                         'opt_sensor_mode', 'sensor_observation_outer_vlan'):
              assert symbol in telemetry
          assert 'MSG_DONTWAIT' in telemetry
          assert 'event[1024]' in telemetry and 'sensor_wire[1280]' in telemetry
          assert 'OBS|%s|%s|%s|%.*s' in telemetry
          assert 'malloc(' not in telemetry and 'calloc(' not in telemetry and 'realloc(' not in telemetry
          print('Telemetry architecture/hot-path invariants: PASS')
          PY

      - name: Telemetry engine sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_telemetry.c -o /tmp/test-telemetry-san
          /tmp/test-telemetry-san

      - name: Packet normalization engine regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_packet.c -o /tmp/test-packet
          /tmp/test-packet
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text(); packet = Path('src/argos_packet.h').read_text()
          assert src.count('#include "argos_packet.h"') == 1
          assert 'argos_packet_view_t packet_view;' in src
          assert 'argos_packet_decode(pkt_type, buffer, (int)len, opt_v6, &packet_view)' in src
          assert 'static int strip_l2(' not in src
          assert 'static int skip_ipv6_exthdrs(' not in src
          for symbol in ('argos_packet_view_t', 'argos_packet_decode', 'argos_packet_strip_l2',
                         'argos_packet_ipv6_l4', 'ipv4_header_info', 'ipv6_packet_info'):
              assert symbol in packet
          assert 'malloc(' not in packet and 'calloc(' not in packet and 'realloc(' not in packet
          assert 'memcpy(v->frame' not in packet and 'const unsigned char *frame;' in packet
          assert 'packet_view.packet_end' in src
          print('Packet engine architecture/hot-path invariants: PASS')
          PY

      - name: Packet normalization engine sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_packet.c -o /tmp/test-packet-san
          /tmp/test-packet-san

      - name: Capture plane regression and sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_capture.c -o /tmp/test-capture
          /tmp/test-capture
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_capture.c -o /tmp/test-capture-san
          /tmp/test-capture-san
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/argos-sniffer.c').read_text(); c=Path('src/argos_capture.h').read_text()
          assert s.count('#include "argos_capture.h"') == 1
          for symbol in ('argos_capture_open', 'argos_capture_receive',
                         'argos_capture_report_stats', 'argos_capture_close'):
              assert symbol in c and symbol in s
          for old in ('static capture_iface_t active_ifaces', 'hatype_to_link('):
              assert old not in s
          assert 'recvmsg(iface->fd, &msg, MSG_TRUNC)' in c
          assert 'argos_packet_decode' not in c and 'argos_filter_match' not in c
          assert len(c) < 10000
          print('Capture plane ownership invariants: PASS')
          PY

      - name: Stateless discovery engine regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_discovery.c -o /tmp/test-discovery
          /tmp/test-discovery
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text()
          engine = Path('src/argos_discovery.h').read_text()
          assert src.count('#include "argos_discovery.h"') == 1
          for symbol in ('argos_discovery_nbns_parse', 'argos_discovery_arp_parse',
                         'argos_discovery_dhcp4_parse', 'argos_discovery_dhcp6_parse',
                         'argos_discovery_ndp_parse', 'argos_discovery_ra_parse',
                         'argos_discovery_mdns_parse', 'argos_discovery_dns_name'):
              assert symbol in engine and symbol in src
          for old in ('decode_netbios_name(', 'decode_dhcp6_name(', 'ndp_find_lladdr('):
              assert old not in src
          for forbidden in ('malloc(', 'calloc(', 'realloc(', 'emit_telemetry(',
                            'dedup_should_suppress', 'owner4_', 'owner6_', 'is_routed_source_'):
              assert forbidden not in engine
          assert 'Stateless discovery protocol decoding' in engine
          assert len(engine) < 20000
          print('Discovery engine architecture/hot-path invariants: PASS')
          PY

      - name: Stateless discovery engine sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_discovery.c -o /tmp/test-discovery-san
          /tmp/test-discovery-san

      - name: Bounded filter engine regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_filter.c -o /tmp/test-filter
          /tmp/test-filter
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text()
          engine = Path('src/argos_filter.h').read_text()
          assert src.count('#include "argos_filter.h"') == 1
          assert 'SECTION: Shunting-Yard Filter Engine' not in src
          for symbol in ('argos_filter_program_t', 'argos_filter_compile',
                         'argos_filter_match', 'argos_filter_parse_mac',
                         'argos_filter_parse_cidr_bits'):
              assert symbol in engine and symbol in src
          assert 'static inline int argos_filter_match' in engine
          assert 'int stack[ARGOS_FILTER_MAX_TOKENS]' in engine
          assert '#define ARGOS_FILTER_MAX_TOKENS 64' in engine
          for forbidden in ('malloc(', 'calloc(', 'realloc(', 'emit_telemetry(',
                            'dedup_should_suppress', 'owner4_', 'owner6_'):
              assert forbidden not in engine
          assert len(engine) < 18000
          print('Filter engine architecture/hot-path invariants: PASS')
          PY

      - name: Bounded filter engine sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_filter.c -o /tmp/test-filter-san
          /tmp/test-filter-san

      - name: TLS ClientHello / JA4 regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_tls_client.c -o /tmp/test-tls-client
          /tmp/test-tls-client
          python3 - <<'PY'
          from pathlib import Path
          t = Path('src/argos_tls.h').read_text()
          s = Path('src/argos-sniffer.c').read_text()
          decl = "char alpn_first = '0', alpn_last = '0';"
          fallback = 'if (alpn[0] == \'\\0\') strcpy(alpn, "none");'
          use = "a_cipher_count, a_ext_count, alpn_first, alpn_last"
          assert t.count(decl) == 1
          assert t.index(decl) < t.index(fallback) < t.index(use)
          assert 'These placeholders are telemetry-only and never feed JA4.' in t
          assert 'argos_tls_client_parse(payload, len, &tls)' in s
          assert 'dedup_should_suppress' not in t
          assert 'emit_telemetry' not in t
          print('TLS ClientHello engine / JA4 ALPN ordering: PASS')
          PY

      - name: TLS ClientHello sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_tls_client.c -o /tmp/test-tls-client-san
          /tmp/test-tls-client-san

      - name: QUIC v2 RFC 9369 vectors
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_quic_v2.c -o /tmp/test-quic-v2
          /tmp/test-quic-v2

      - name: Netlink prefix refresh fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_netlink_refresh.c -o /tmp/test-netlink-refresh
          /tmp/test-netlink-refresh
          grep -F 'RTMGRP_IPV4_IFADDR | RTMGRP_IPV6_IFADDR' src/argos_network.h
          grep -F 'argos_network_netlink_drain(lan_netlink_fd)' src/argos-sniffer.c
          ! grep -F 'RTMGRP_LINK' src/argos_network.h

      - name: Bounded network context engine regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_network.c -o /tmp/test-network
          /tmp/test-network
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_rip.c -o /tmp/test-rip
          /tmp/test-rip
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_exporters.c -o /tmp/test-exporters
          /tmp/test-exporters
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text()
          engine = Path('src/argos_network.h').read_text()
          assert src.count('#include "argos_network.h"') == 1
          assert 'SECTION: LAN prefix learning' not in src
          assert 'owner4_table' not in src and 'owner6_table' not in src
          for symbol in ('argos_network_state_t', 'argos_network_owner4_note',
                         'argos_network_owner6_mismatch', 'argos_network_is_lan4',
                         'argos_network_routed6', 'argos_network_netlink_drain'):
              assert symbol in engine and symbol in src
          for bound in ('ARGOS_NETWORK_OWNER4_SLOTS 256U',
                        'ARGOS_NETWORK_OWNER6_SLOTS 128U',
                        'ARGOS_NETWORK_OWNER_PROBES 4U',
                        'ARGOS_NETWORK_OWNER_TTL_SECS 180',
                        'ARGOS_NETWORK_MAX_PREFIXES 64'):
              assert bound in engine
          assert 'static inline int argos_network_routed4' in engine
          assert 'static inline int argos_network_routed6' in engine
          # Canonical PTP/RIP ownership replaces deleted staging headers; source
          # length is bounded here only to catch accidental bulk growth.
          assert len(engine) <= 28700
          print('Network engine architecture/bounds: PASS')
          PY

      - name: Network context engine sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_network.c -o /tmp/test-network-san
          /tmp/test-network-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_rip.c -o /tmp/test-rip-san
          /tmp/test-rip-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_exporters.c -o /tmp/test-exporters-san
          /tmp/test-exporters-san

      - name: Dynamic BPF functional matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf
          /tmp/test-dynamic-bpf
          grep -F 'argos_bpf_attach(sock, bpf)' src/argos_capture.h
          grep -F 'ARGOS_ENTERPRISE_TCP_PORTS' src/argos_bpf.h
          grep -F '44818' src/argos_enterprise_ports.h
          grep -F 'case 44818: return ae_cip' src/argos_enterprise.h
          ! grep -F 'attach_argos_kernel_filter' src/argos-sniffer.c
          ! grep -F 'attach_argos_enterprise_kernel_filter' src/argos_enterprise.h

      - name: LLDP-MED fingerprint fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_lldp_med.c -o /tmp/test-lldp-med
          /tmp/test-lldp-med
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text(); bpf = Path('src/argos_bpf.h').read_text(); l2 = Path('src/argos_l2.h').read_text()
          assert 'p[pos] == 0x00U && p[pos + 1U] == 0x12U && p[pos + 2U] == 0xbbU' in l2
          assert 'subtype == 3U' not in l2
          assert 'LLDP-MED|%s|-|-|%s%s' in src
          assert 'EMIT(abpf_pass_ethertype(p, 0x88cc)); /* LLDP / LLDP-MED */' in bpf
          assert 'SECRET-ROOM-42' not in src
          print('LLDP-MED integration/privacy regression: PASS')
          PY

      - name: LLDP-MED sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_lldp_med.c -o /tmp/test-lldp-med-san
          /tmp/test-lldp-med-san

      - name: Classic STP fingerprint fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_stp.c -o /tmp/test-stp
          /tmp/test-stp
          python3 - <<'PY'
          from pathlib import Path
          src=Path('src/argos-sniffer.c').read_text(); l2=Path('src/argos_l2.h').read_text(); bpf=Path('src/argos_bpf.h').read_text()
          assert 'p[0] != 0x42U || p[1] != 0x42U || p[2] != 0x03U' in l2
          assert 'r->version != 0U' in l2
          assert 'STP|%s|-|-|%s%s' in src
          assert 'argos_dispatch_l2_protocol(l3_proto) == ARGOS_PROTOCOL_STP' in src
          assert 'argos_dispatch_protocol_enabled(&dispatch_plan, ARGOS_PROTOCOL_STP)' in src
          assert 'BPF_JGT | BPF_K, 1500' in bpf
          print('classic STP integration regression: PASS')
          PY

      - name: Classic STP sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_stp.c -o /tmp/test-stp-san
          /tmp/test-stp-san

      - name: LACP fingerprint fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_lacp.c -o /tmp/test-lacp
          /tmp/test-lacp
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text(); bpf = Path('src/argos_bpf.h').read_text(); l2 = Path('src/argos_l2.h').read_text()
          assert 'p[0] != 0x01U' in l2
          assert 'p[2] != 0x01U || p[3] != 0x14U' in l2
          assert 'p[22] != 0x02U || p[23] != 0x14U' in l2
          assert 'actor_system=%s actor_priority=%u' in l2
          assert 'LACP|%s|-|-|%s%s' in src
          assert 'EMIT(abpf_pass_ethertype(p, 0x8809)); /* Slow Protocols / LACP */' in bpf
          assert src.count('l3_proto == 0x8809U') >= 3
          print('LACP integration regression: PASS')
          PY

      - name: LACP sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_lacp.c -o /tmp/test-lacp-san
          /tmp/test-lacp-san

      - name: FHRP engine fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_vrrp.c -o /tmp/test-vrrp
          /tmp/test-vrrp
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_hsrp1.c -o /tmp/test-hsrp1
          /tmp/test-hsrp1
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_hsrp2.c -o /tmp/test-hsrp2
          /tmp/test-hsrp2
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text(); fhrp = Path('src/argos_fhrp.h').read_text()
          assert '#include "argos_fhrp.h"' in src
          for old in ('argos_vrrp.h', 'argos_hsrp.h'):
              assert not Path('src/' + old).exists()
              assert old not in src
          for symbol in ('argos_vrrp_parse', 'argos_hsrp1_parse', 'argos_hsrp2_parse'):
              assert symbol in fhrp
          assert 'emit_telemetry' not in fhrp
          assert 'dedup_should_suppress' not in fhrp
          print('Unified FHRP engine architecture invariants: PASS')
          PY

      - name: FHRP engine sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          for t in test_vrrp test_hsrp1 test_hsrp2; do
            cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer tests/${t}.c -o /tmp/${t}-san
            /tmp/${t}-san
          done

      - name: TLS port policy and DoT regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ports = Path('src/argos_tls_ports.h').read_text(); src = Path('src/argos-sniffer.c').read_text(); bpf = Path('src/argos_bpf.h').read_text()
          for port in ('443U', '465U', '853U', '993U', '995U', '8443U'): assert port in ports
          assert '587U' not in ports
          assert 'ARGOS_TLS_TCP_PORTS' in bpf
          assert 'ADD(ud, ud_n, ARGOS_QUIC_UDP_PORT)' in bpf
          assert src.count('argos_tls_tcp_port(dport)') >= 3
          assert 'ARGOS_PROTOCOL_DOT' in src
          assert 'ARGOS_PROTOCOL_TLS' in src
          assert 'int tls_tcp =' in src
          assert 'int dot_tcp =' in src
          assert '(opt_tls' not in src
          assert 'dport == 853U' in src
          assert 'DOT|%s|%s|%s|%s|%s|%s%s' in src
          print('TLS port policy / DoT regression: PASS')
          PY

      - name: TLS ServerHello golden fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_tls_server.c -o /tmp/test-tlssrv
          /tmp/test-tlssrv
          python3 - <<'PY'
          from pathlib import Path
          src=Path('src/argos-sniffer.c').read_text(); bpf=Path('src/argos_bpf.h').read_text(); tls=Path('src/argos_tls.h').read_text()
          assert 'ats1_' in tls
          assert 'JA4S|' not in src
          assert 'ADD(ts, ts_n, ARGOS_TLS_TCP_PORTS[i])' in bpf
          assert 'argos_tls_tcp_port(sport)' in src
          assert 'TLSSRV|%s|%s|%s|%u|%s|%s%s' in src
          print('Argos TLS ServerHello integration: PASS')
          PY

      - name: TLS ServerHello sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_tls_server.c -o /tmp/test-tlssrv-san
          /tmp/test-tlssrv-san

      - name: Dynamic BPF sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf-san
          /tmp/test-dynamic-bpf-san

      - name: Enterprise parser fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise

      - name: Enterprise parser sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_enterprise.c -o /tmp/test-enterprise-san
          /tmp/test-enterprise-san

      - name: CLI contract
        run: |
          /tmp/argos-sniffer-v6-stub --help | grep -Fx 'argos-sniffer v6.0'
          /tmp/argos-sniffer-v6-stub --help | grep -Fx 'Passive network fingerprinting & telemetry engine'
          /tmp/argos-sniffer-v6-stub --version | grep -Fx 'argos-sniffer v6.0 (build 6.0.0-dev)'
          /tmp/argos-sniffer-v6-stub --help | grep -F -- '--enterprise'
          /tmp/argos-sniffer-v6-stub --help | grep -F 'ENT|mac|src_ip|dst_ip|protocol|fingerprint'
          /tmp/argos-sniffer-v6-stub --help | grep -F 'DOT|mac|src_ip|dst_ip|sni|ja4_fingerprint|alpn'
          /tmp/argos-sniffer-v6-stub --help | grep -F 'TLSSRV|mac|server_ip|client_ip|server_port|ats1_fingerprint|alpn'

  arm64:
    name: ARM64 strict cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ARM64 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile full QUIC
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-arm64-full
          file /tmp/argos-sniffer-v6-arm64-full | grep -F 'ARM aarch64'
      - name: Cross-compile QUIC stub
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-arm64-stub
          file /tmp/argos-sniffer-v6-arm64-stub | grep -F 'ARM aarch64'
