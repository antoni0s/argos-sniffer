name: V6 enterprise CI

on:
  push:
    branches: [version-6]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native strict build and parser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict compile - full QUIC
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-full

      - name: Strict compile - QUIC stub
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-stub

      - name: JA4 ALPN regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/argos-sniffer.c').read_text()
          decl = "char alpn_first = '0', alpn_last = '0';"
          fallback = 'if (alpn[0] == \'\\0\') strcpy(alpn, "none");'
          use = "a_cipher_count, a_ext_count, alpn_first, alpn_last"
          assert s.count(decl) == 1
          assert s.index(decl) < s.index(fallback) < s.index(use)
          assert 'These placeholders are telemetry-only and never feed JA4.' in s
          print('JA4 ALPN fallback ordering: PASS')
          PY

      - name: QUIC v2 RFC 9369 vectors
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/test_quic_v2.c -o /tmp/test-quic-v2
          /tmp/test-quic-v2

      - name: Netlink prefix refresh fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/test_netlink_refresh.c -o /tmp/test-netlink-refresh
          /tmp/test-netlink-refresh
          grep -F 'RTMGRP_IPV4_IFADDR | RTMGRP_IPV6_IFADDR' src/argos-sniffer.c
          grep -F 'lan_netlink_drain(lan_netlink_fd)' src/argos-sniffer.c
          ! grep -F 'RTMGRP_LINK' src/argos-sniffer.c

      - name: Dynamic BPF functional matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf
          /tmp/test-dynamic-bpf
          grep -F 'argos_bpf_attach(sock, &bpf_cfg)' src/argos-sniffer.c
          grep -F 'ARGOS_ENTERPRISE_TCP_PORTS' src/argos_bpf.h
          grep -F '44818' src/argos_enterprise_ports.h
          grep -F 'case 44818: return ae_cip' src/argos_enterprise.h
          ! grep -F 'attach_argos_kernel_filter' src/argos-sniffer.c
          ! grep -F 'attach_argos_enterprise_kernel_filter' src/argos_enterprise.h

      - name: Dynamic BPF sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf-san
          /tmp/test-dynamic-bpf-san

      - name: Enterprise parser fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise

      - name: Enterprise parser sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_enterprise.c -o /tmp/test-enterprise-san
          /tmp/test-enterprise-san

      - name: CLI contract
        run: |
          /tmp/argos-sniffer-v6-stub --help | grep -F 'argos-sniffer v6.0.0-dev'
          /tmp/argos-sniffer-v6-stub --help | grep -F -- '--enterprise'
          /tmp/argos-sniffer-v6-stub --help | grep -F 'ENT|mac|src_ip|dst_ip|protocol|fingerprint'

  arm64:
    name: ARM64 strict cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM64 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile full QUIC
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-arm64-full
          file /tmp/argos-sniffer-v6-arm64-full | grep -F 'ARM aarch64'

      - name: Cross-compile QUIC stub
        run: |
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-arm64-stub
          file /tmp/argos-sniffer-v6-arm64-stub | grep -F 'ARM aarch64'
