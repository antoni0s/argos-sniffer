name: V6 step 11a - DNSEXT correlation gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step11a_dnsext_patch.py'
      - '.github/workflows/v6-step11a-dnsext.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step11a_dnsext_patch.py

      - name: DNSEXT tuple correlation fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dns_track.c -o /tmp/test-dns-track
          /tmp/test-dns-track

      - name: DNSEXT source integration invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_dns_track.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          assert 'ARGOS_DNS_TRACK_PROBES 8U' in h
          assert 'ARGOS_DNS_TRACK_TTL_USEC 5000000ULL' in h
          for f in ('client_addr[16]','server_addr[16]','client_port','server_port','qname_hash','qtype','txid','ip_version'):
              assert f in h
          assert 'memcmp(e->client_addr' in h and 'memcmp(e->server_addr' in h
          assert 'flow_dst_addr, flow_src_addr' in s
          assert 'dport, sport, txid, response_qtype, response_qname' in s
          assert 'read_be16(payload + 4) > 0U' in s
          assert 'tracked->valid = 0' in s
          assert 'flow_src_key' not in s and 'flow_dst_key' not in s and 'addr6_key(' not in s
          assert '(txid ^' not in s
          print('DNSEXT integration invariants: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub

      - name: DNSEXT sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_dns_track.c -o /tmp/test-dns-track-san
          /tmp/test-dns-track-san

      - name: Existing network regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_stun_turn.c -o /tmp/test-stun && /tmp/test-stun
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_mqtt.c -o /tmp/test-mqtt && /tmp/test-mqtt
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_coap.c -o /tmp/test-coap && /tmp/test-coap
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_igmp_mld.c -o /tmp/test-igmp-mld && /tmp/test-igmp-mld
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_ntp.c -o /tmp/test-ntp && /tmp/test-ntp
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_wireguard.c -o /tmp/test-wireguard && /tmp/test-wireguard
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise && /tmp/test-enterprise

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_dns_track.h src/argos-sniffer.c tests/test_dns_track.c
          git commit -m 'fix(v6): bind DNSEXT correlation to full DNS tuple'
          git push origin HEAD:version-6
