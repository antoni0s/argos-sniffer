name: V6 step 11b - bounded UDP class suppression

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step11b_udp_suppress_patch.py'
      - '.github/workflows/v6-step11b-udp-suppress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step11b_udp_suppress_patch.py

      - name: UDP suppression fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_udp_suppress.c -o /tmp/test-udp-suppress
          /tmp/test-udp-suppress

      - name: WireGuard structural regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_wireguard.c -o /tmp/test-wireguard
          /tmp/test-wireguard

      - name: UDP suppression safety invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/argos-sniffer.c').read_text()
          u=Path('src/argos_udp_suppress.h').read_text()
          w=Path('src/argos_wireguard.h').read_text()
          assert 'ARGOS_UDP_SUPPRESS_SLOTS 256U' in u
          assert 'ARGOS_UDP_SUPPRESS_PROBES 2U' in u
          assert 'ARGOS_UDP_SUPPRESS_TTL_SECS 5U' in u
          assert 'Suppressed hits deliberately do NOT refresh' in u
          assert 'argos_wireguard_transport_kind' in w
          assert 'wg_transport == 2' in s
          assert 'argos_udp_suppress_recent(udp_suppress_table' in s
          assert 'Handshake/cookie types' in s and 'keepalives are always parsed' in s
          assert 'DNS/DHCP/QUIC/STUN/CoAP/NTP' in s
          # The generic UDP parser path remains untouched by suppression.
          assert 'if (opt_enterprise && argos_enterprise_udp_port(sport, dport))' in s
          assert 'argos_enterprise_parse_udp(sport, dport, payload, payload_len' in s
          print('Bounded UDP suppression safety invariants: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub

      - name: UDP suppression sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_udp_suppress.c -o /tmp/test-udp-suppress-san
          /tmp/test-udp-suppress-san

      - name: Existing flow and network regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_app_flow.c -lm -o /tmp/test-app-flow && /tmp/test-app-flow
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dns_track.c -o /tmp/test-dns-track && /tmp/test-dns-track
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_stun_turn.c -o /tmp/test-stun && /tmp/test-stun
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_coap.c -o /tmp/test-coap && /tmp/test-coap
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_ntp.c -o /tmp/test-ntp && /tmp/test-ntp
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise && /tmp/test-enterprise

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_udp_suppress.h src/argos_wireguard.h src/argos-sniffer.c tests/test_udp_suppress.c
          git commit -m 'perf(v6): suppress repeated WireGuard transport parsing'
          git push origin HEAD:version-6
