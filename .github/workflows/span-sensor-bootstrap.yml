name: SPAN sensor bootstrap

on:
  push:
    branches:
      - feature/span-sensor
    paths:
      - tools/apply_span_sensor_mvp.py
      - .github/workflows/span-sensor-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/span-sensor
          fetch-depth: 0

      - name: Normalize bootstrap C escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_span_sensor_mvp.py')
          s = p.read_text(encoding='utf-8')
          old = "helper_code = helper_anchor + '''"
          new = "helper_code = helper_anchor + r'''"
          if old not in s:
              raise SystemExit('helper_code anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply sensor MVP patch
        run: python3 tools/apply_span_sensor_mvp.py

      - name: Compile full QUIC build
        run: cc -std=c11 -O2 -Wall -Wextra -Wpedantic src/argos-sniffer.c -lm -o /tmp/argos-sniffer-full

      - name: Compile minimal QUIC-stub build
        run: cc -std=c11 -O2 -Wall -Wextra -Wpedantic -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

      - name: Sensor VLAN and gateway compatibility smoke test
        run: |
          set -euo pipefail
          sudo ip link add argos-test0 type veth peer name argos-test1
          sudo ip link set argos-test0 up
          sudo ip link set argos-test1 up
          trap 'sudo ip link del argos-test0 2>/dev/null || true' EXIT

          cat >/tmp/argos-inject.py <<'PY'
          import socket, struct

          def mac_bytes(name):
              text = open(f'/sys/class/net/{name}/address', encoding='ascii').read().strip()
              return bytes(int(x, 16) for x in text.split(':'))

          def checksum(data):
              if len(data) & 1:
                  data += b'\x00'
              total = sum(struct.unpack(f'!{len(data)//2}H', data))
              total = (total & 0xffff) + (total >> 16)
              total += total >> 16
              return (~total) & 0xffff

          qname = b'\x07example\x03com\x00'
          dns = struct.pack('!HHHHHH', 0x1234, 0x0100, 1, 0, 0, 0) + qname + struct.pack('!HH', 1, 1)
          udp = struct.pack('!HHHH', 53000, 53, 8 + len(dns), 0) + dns
          src_ip = socket.inet_aton('10.20.0.2')
          dst_ip = socket.inet_aton('8.8.8.8')
          total_len = 20 + len(udp)
          ip0 = struct.pack('!BBHHHBBH4s4s', 0x45, 0, total_len, 0x1234, 0, 64, 17, 0, src_ip, dst_ip)
          ip = struct.pack('!BBHHHBBH4s4s', 0x45, 0, total_len, 0x1234, 0, 64, 17, checksum(ip0), src_ip, dst_ip)
          dst = mac_bytes('argos-test0')
          src = mac_bytes('argos-test1')
          eth_vlan20 = dst + src + struct.pack('!HHH', 0x8100, 20, 0x0800)
          frame = eth_vlan20 + ip + udp
          s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW)
          s.bind(('argos-test1', 0))
          s.send(frame)
          s.close()
          PY

          sudo /tmp/argos-sniffer-full --sensor --sensor-name ci-sensor --inside 10.20.0.0/24 -i argos-test0 -q -f 0 >/tmp/argos-sensor.out 2>/tmp/argos-sensor.err &
          sensor_pid=$!
          sleep 0.3
          sudo python3 /tmp/argos-inject.py
          sleep 0.4
          sudo kill -TERM "$sensor_pid" 2>/dev/null || true
          wait "$sensor_pid" 2>/dev/null || true
          cat /tmp/argos-sensor.out
          grep -E '^OBS\|ci-sensor\|argos-test0\|20\|DNS\|[^|]+\|10\.20\.0\.2\|example\.com$' /tmp/argos-sensor.out

          sudo /tmp/argos-sniffer-full -i argos-test0 -q -f 0 >/tmp/argos-gateway.out 2>/tmp/argos-gateway.err &
          gateway_pid=$!
          sleep 0.3
          sudo python3 /tmp/argos-inject.py
          sleep 0.4
          sudo kill -TERM "$gateway_pid" 2>/dev/null || true
          wait "$gateway_pid" 2>/dev/null || true
          cat /tmp/argos-gateway.out
          grep -E '^DNS\|[^|]+\|10\.20\.0\.2\|example\.com$' /tmp/argos-gateway.out
          if grep -q '^OBS|' /tmp/argos-gateway.out; then
            echo 'Gateway regression: OBS envelope appeared without --sensor' >&2
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check

      - name: Commit implementation
        run: |
          if git diff --quiet -- src/argos-sniffer.c; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos-sniffer.c
          git commit -m "Add SPAN sensor MVP"
          git push origin HEAD:feature/span-sensor
