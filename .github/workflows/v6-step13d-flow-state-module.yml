name: V6 step 13d - flow state module gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step13d_flow_state_module.py'
      - '.github/scripts/v6_step13d_flow_test_adapter.py'
      - '.github/workflows/v6-step13d-flow-state-module.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flow-state-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged flow-state extraction
        run: |
          python3 .github/scripts/v6_step13d_flow_state_module.py
          python3 .github/scripts/v6_step13d_flow_test_adapter.py

      - name: Flow-state module fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_app_flow.c -o /tmp/test-app-flow
          /tmp/test-app-flow

      - name: Flow-state module sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_app_flow.c -o /tmp/test-app-flow-san
          /tmp/test-app-flow-san

      - name: Flow architecture invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_flow_state.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          t=Path('tests/test_app_flow.c').read_text()
          checks={
            'module included': '#include "argos_flow_state.h"' in s,
            'fixed state': 'ARGOS_FLOW_SLOTS 1024U' in h and 'ARGOS_FLOW_PROBES 4U' in h,
            'ttl preserved': 'ARGOS_FLOW_TTL_SECS 60' in h,
            'budget preserved': 'ARGOS_FLOW_PACKET_BUDGET 8U' in h,
            'allocation free': 'malloc(' not in h and 'calloc(' not in h and 'realloc(' not in h,
            'syn generation reset': 'argos_flow_reset_pair(&app_flow_state' in s and 'rapid 5-tuple reuse' in h,
            'generic done state': 'argos_flow_should_skip(&app_flow_state' in s and 'argos_flow_note_payload(&app_flow_state' in s,
            'protocol policy remains main': 'static int app_flow_payload_complete' in s and 'argos_tls_server_parse' in s,
            'udp remains separate': 'udp_suppress_table' in s and 'argos_udp_suppress_entry_t' in s,
            'legacy table removed': 'app_flow_table' not in s and 'app_flow_entry_t' not in s,
            'expiry fixture': '1121' in t and 'argos_flow_find_at' in t,
          }
          bad=[k for k,v in checks.items() if not v]
          assert not bad, 'failed contracts: '+', '.join(bad)
          print('flow-state architecture invariants: PASS')
          PY

      - name: Existing flow network and identity regressions
        run: |
          for f in \
            tests/test_udp_suppress.c \
            tests/test_ntlm_flow_completion.c \
            tests/test_wireguard.c \
            tests/test_dns_track.c \
            tests/test_identity_framework.c \
            tests/test_identity_rdp.c \
            tests/test_identity_ntlm.c \
            tests/test_identity_kerberos.c \
            tests/test_identity_radius.c \
            tests/test_enterprise.c; do
            out="/tmp/$(basename "$f" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$f" -lm -o "$out"
            "$out"
          done

      - name: Strict full and stub builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

      - name: Commit refactor only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos_flow_state.h src/argos-sniffer.c tests/test_app_flow.c
          git diff --cached --quiet && exit 0
          git commit -m "refactor(v6): extract TCP flow-state module"
          git push origin HEAD:version-6
