name: V6 step 7e - MSTP gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step7e_mstp_patch.py'
      - '.github/workflows/v6-step7e-mstp.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0
      - name: Apply staged patch
        run: python3 .github/scripts/v6_step7e_mstp_patch.py
      - name: MSTP fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_mstp.c -o /tmp/test-mstp
          /tmp/test-mstp
      - name: STP and RSTP regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_stp.c -o /tmp/test-stp && /tmp/test-stp
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_rstp.c -o /tmp/test-rstp && /tmp/test-rstp
      - name: MSTP integration/privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('src/argos-sniffer.c').read_text(); stp=Path('src/argos_stp.h').read_text()
          assert 'p[5]!=0x03U || p[6]!=0x02U' in stp
          assert 'r->version3_length < 64U' in stp
          assert '(r->version3_length-64U) % 16U' in stp
          assert 'raw\n * 32-byte MST configuration name is intentionally not emitted' in stp
          assert 'ENT|%s|-|-|MSTP|%s' in src
          print('MSTP integration/privacy invariants: PASS')
          PY
      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub
          git diff --check
      - name: MSTP sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_mstp.c -o /tmp/test-mstp-san
          /tmp/test-mstp-san
      - name: Existing L2 regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_lacp.c -o /tmp/test-lacp && /tmp/test-lacp
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_lldp_med.c -o /tmp/test-lldp-med && /tmp/test-lldp-med
      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c src/argos_stp.h tests/test_mstp.c
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v6): fingerprint MSTP region and CIST state'
          git push origin HEAD:version-6
