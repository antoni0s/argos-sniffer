name: V6 step 12c - RDP identity gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step12c_rdp_identity.py'
      - '.github/workflows/v6-step12c-rdp-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp-identity-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged RDP identity extractor
        run: python3 .github/scripts/v6_step12c_rdp_identity.py

      - name: RDP identity fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_rdp.c -o /tmp/test-identity-rdp
          /tmp/test-identity-rdp

      - name: RDP identity sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_identity_rdp.c -o /tmp/test-identity-rdp-san
          /tmp/test-identity-rdp-san

      - name: RDP identity integration and privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_identity.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          e=Path('src/argos_enterprise.h').read_text()
          assert 'argos_identity_rdp_mstshash' in h
          assert 'p[5] != 0xe0U' in h
          assert 'if (n > 120U) n = 120U' in h
          assert 'if (opt_identity && dport == 3389U' in s
          assert 'opt_identity_raw, &ident' in s
          assert 'emit_telemetry("IDENT|%s|%s|%s|%s|%s%s\\n"' in s
          assert 'dedup_should_suppress(ident_mac, "IDENT"' in s
          # Default ENT remains privacy-redacted regardless of raw identity mode.
          assert 'cookie_present=%u cookie_len=%u cookie_hash=%08x' in e
          assert 'cookie=%s' not in e
          assert 'opt_identity_raw' not in e
          # No generic content scanner was introduced.
          assert 'No stream scan occurs' in h
          print('RDP identity integration/privacy invariants: PASS')
          PY

      - name: Existing RDP enterprise privacy fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise

      - name: Identity framework regression fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_framework.c -o /tmp/test-identity-framework
          /tmp/test-identity-framework

      - name: Strict full and stub builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

      - name: Commit production extractor only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos_identity.h src/argos-sniffer.c tests/test_identity_rdp.c
          git diff --cached --quiet && exit 0
          git commit -m "feat(v6): extract opt-in RDP identity evidence"
          git push origin HEAD:version-6
