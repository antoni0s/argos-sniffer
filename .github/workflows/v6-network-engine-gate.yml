name: V6 network context engine gate

on:
  push:
    branches: [version-6]
    paths:
      - src/argos_network.h
      - tests/test_network.c
      - tests/test_netlink_refresh.c
      - ci/staging/network-engine.patch
      - .github/workflows/v6-network-engine-gate.yml
  pull_request:
    branches: [version-6]
    paths:
      - src/argos-sniffer.c
      - src/argos_network.h
      - src/argos_netlink.h
      - tests/test_network.c
      - tests/test_netlink_refresh.c
      - ci/staging/network-engine.patch
      - .github/workflows/v6-network-engine-gate.yml
      - .github/workflows/v6-ci.yml
      - .github/workflows/v6-identity-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-engine:
    name: Fixtures, sanitizers, native and ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baseline strict builds and size
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-before
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-before-stub
          size /tmp/argos-before | awk 'NR==2 {print $1}' > /tmp/before-text

      - name: Prepare staged or PR candidate
        run: |
          if grep -q 'static argos_network_state_t network_state' src/argos-sniffer.c; then
            echo 'Production candidate already contains staged extraction'
            echo 155341 > /tmp/before-text
          else
            git apply --check ci/staging/network-engine.patch
            git apply ci/staging/network-engine.patch
          fi

      - name: Architecture, bounds and hot-path invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text()
          engine = Path('src/argos_network.h').read_text()
          assert src.count('#include "argos_network.h"') == 1
          assert 'SECTION: LAN prefix learning' not in src
          assert 'owner4_table' not in src and 'owner6_table' not in src
          for symbol in ('argos_network_state_t', 'argos_network_owner4_note',
                         'argos_network_owner6_mismatch', 'argos_network_is_lan4',
                         'argos_network_routed6', 'argos_network_netlink_drain'):
              assert symbol in engine and symbol in src
          for bound in ('ARGOS_NETWORK_OWNER4_SLOTS 256U',
                        'ARGOS_NETWORK_OWNER6_SLOTS 128U',
                        'ARGOS_NETWORK_OWNER_PROBES 4U',
                        'ARGOS_NETWORK_OWNER_TTL_SECS 180',
                        'ARGOS_NETWORK_MAX_PREFIXES 64'):
              assert bound in engine
          assert 'static inline int argos_network_routed4' in engine
          assert 'static inline int argos_network_routed6' in engine
          assert 'RTMGRP_IPV4_IFADDR | RTMGRP_IPV6_IFADDR' in engine
          assert 'RTMGRP_LINK' not in engine
          assert len(engine) < 20000
          print('Network engine architecture/bounds: PASS')
          PY

      - name: Network fixtures and sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_network.c -o /tmp/test-network
          /tmp/test-network
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_netlink_refresh.c -o /tmp/test-netlink-refresh
          /tmp/test-netlink-refresh
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_network.c -o /tmp/test-network-san
          /tmp/test-network-san

      - name: Full native regression matrix and size guard
        run: |
          set -eu
          for source in tests/test_*.c; do
            binary="/tmp/$(basename "$source" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$source" -lm -o "$binary"
            "$binary"
          done
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-after
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-after-stub
          before=$(cat /tmp/before-text)
          after=$(size /tmp/argos-after | awk 'NR==2 {print $1}')
          test "$after" -le "$before"
          echo "optimized .text: $before -> $after"

      - name: ARM64 strict full and stub builds
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-arm64-full
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-arm64-stub
