name: V6 step 13e - unified flow-state gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step13e_merge_udp_flow_state.py'
      - '.github/workflows/v6-step13e-flow-unification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged refactor
        run: python3 .github/scripts/v6_step13e_merge_udp_flow_state.py

      - name: Architecture invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('src/argos_flow_state.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          t=Path('tests/test_udp_suppress.c').read_text()
          assert not Path('src/argos_udp_suppress.h').exists()
          assert '#include "argos_udp_suppress.h"' not in s
          assert '#include "../src/argos_flow_state.h"' in t
          assert 'ARGOS_FLOW_SLOTS 1024U' in f
          assert 'ARGOS_UDP_SUPPRESS_SLOTS 256U' in f
          assert 'ARGOS_UDP_SUPPRESS_TTL_SECS 5U' in f
          assert 'Suppressed hits deliberately do NOT refresh' in f
          assert f.count('1099511628211ULL') == 1
          assert 'argos_flow_hash_update' in f
          assert 'argos_udp_suppress_hash_update' not in f
          assert 'malloc(' not in f and 'calloc(' not in f and 'realloc(' not in f
          print('Unified flow-state architecture invariants: PASS')
          PY

      - name: Flow fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_app_flow.c -lm -o /tmp/test-app-flow
          /tmp/test-app-flow
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_ntlm_flow_completion.c -o /tmp/test-ntlm-flow
          /tmp/test-ntlm-flow
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_udp_suppress.c -o /tmp/test-udp-suppress
          /tmp/test-udp-suppress
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_wireguard.c -o /tmp/test-wireguard
          /tmp/test-wireguard

      - name: Flow sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_app_flow.c -lm -o /tmp/test-app-flow-san
          /tmp/test-app-flow-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_udp_suppress.c -o /tmp/test-udp-suppress-san
          /tmp/test-udp-suppress-san

      - name: Existing network and identity fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dns_track.c -o /tmp/test-dns-track
          /tmp/test-dns-track
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_framework.c -o /tmp/test-identity-framework
          /tmp/test-identity-framework

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-stub

      - name: Commit production refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_flow_state.h src/argos-sniffer.c tests/test_udp_suppress.c
          git rm src/argos_udp_suppress.h
          git diff --cached --check
          git commit -m 'refactor(v6): unify TCP and UDP flow state'
          git push origin HEAD:version-6
