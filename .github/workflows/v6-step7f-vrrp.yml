name: V6 step 7f - VRRP gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step7f_vrrp_patch.py'
      - '.github/workflows/v6-step7f-vrrp.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step7f_vrrp_patch.py

      - name: VRRP fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_vrrp.c -o /tmp/test-vrrp
          /tmp/test-vrrp

      - name: Dynamic BPF matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-dynamic-bpf
          /tmp/test-dynamic-bpf

      - name: VRRP integration/privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('src/argos-sniffer.c').read_text()
          hdr=Path('src/argos_vrrp.h').read_text()
          bpf=Path('src/argos_bpf.h').read_text()
          assert 'protocol == 112U && ttl == 255U' in src
          assert 'ENT|%s|%s|%s|VRRP|%s%s' in src
          assert 'BPF_JEQ | BPF_K, 112' in bpf
          assert 'Virtual IP addresses and v2 authentication data are intentionally not' in hdr
          assert 'family=ipv%u' in hdr
          print('VRRP integration/privacy invariants: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub
          git diff --check

      - name: VRRP sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_vrrp.c -o /tmp/test-vrrp-san
          /tmp/test-vrrp-san

      - name: Existing enterprise regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise && /tmp/test-enterprise
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_mstp.c -o /tmp/test-mstp && /tmp/test-mstp

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c src/argos_bpf.h src/argos_vrrp.h tests/test_dynamic_bpf.c tests/test_vrrp.c
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v6): fingerprint VRRP redundancy advertisements'
          git push origin HEAD:version-6
