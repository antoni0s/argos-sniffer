name: V6 step 12f - Kerberos identity gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step12f_kerberos_identity.py'
      - '.github/workflows/v6-step12f-kerberos-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kerberos-identity-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged Kerberos identity patch
        run: python3 .github/scripts/v6_step12f_kerberos_identity.py

      - name: Kerberos AS-REQ identity fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_kerberos.c -o /tmp/test-identity-kerberos
          /tmp/test-identity-kerberos

      - name: Kerberos identity sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_identity_kerberos.c -o /tmp/test-identity-kerberos-san
          /tmp/test-identity-kerberos-san

      - name: Kerberos privacy and scope invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_identity.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          e=Path('src/argos_enterprise.h').read_text()
          t=Path('tests/test_identity_kerberos.c').read_text()
          assert 'argos_identity_kerberos_asreq' in h
          assert 'tag != 0x6aU' in h
          assert 'AS-REQ only; never TGS-REQ' in h
          assert 'PA-DATA, tickets, authenticators, encrypted data and TGS-REQ identity' in h
          assert 'ct == 0xa1U' in h and 'ct == 0xa2U' in h
          assert 'components >= 8U' in h and 'realm_len > 120U' in h
          assert 'if (opt_identity && dport == 88U && payload_len > 0)' in s
          assert 'if (opt_identity && dport == 88U)' in s
          assert 'argos_identity_kerberos_asreq(buffer + payload_offset' in s
          assert 'argos_identity_kerberos_asreq(payload' in s
          assert 'PA-SECRET-DO-NOT-EMIT' not in h and 'PA-SECRET-DO-NOT-EMIT' not in s
          assert 'PA-SECRET-DO-NOT-EMIT' in t
          assert 'request=%s realm=%s etype_count=%u etypes=%s' in e
          assert ' principal=%s' not in e and ' cname=%s' not in e
          print('Kerberos identity privacy/scope invariants: PASS')
          PY

      - name: Existing identity enterprise and flow regressions
        run: |
          for f in tests/test_identity_framework.c tests/test_identity_rdp.c tests/test_identity_ntlm.c tests/test_ntlm_privacy.c tests/test_ntlm_flow_completion.c tests/test_enterprise.c; do
            out="/tmp/$(basename "$f" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$f" -o "$out"
            "$out"
          done

      - name: Strict full and stub builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

      - name: Commit production extractor only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos_identity.h src/argos-sniffer.c tests/test_identity_kerberos.c
          git diff --cached --quiet && exit 0
          git commit -m "feat(v6): extract bounded Kerberos AS-REQ observed identity"
          git push origin HEAD:version-6
