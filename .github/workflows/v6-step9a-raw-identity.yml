name: V6 step 9a - raw IP identity gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step9a_raw_identity_patch.py'
      - '.github/workflows/v6-step9a-raw-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step9a_raw_identity_patch.py

      - name: Raw-IP identity fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_raw_identity.c -o /tmp/test-raw-id
          /tmp/test-raw-id

      - name: Raw-IP integration invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/argos-sniffer.c').read_text(); h=Path('src/argos_raw_identity.h').read_text()
          assert 'pkt_type == LINK_RAW_IP && is_ip_packet' in s
          assert s.index('pkt_type == LINK_RAW_IP && is_ip_packet') < s.index('if (filter_mode2.is_active)')
          assert 'argos_raw_identity_v4(buffer + l3_offset + 12, src_mac)' in s
          assert 'argos_raw_identity_v6(src_ip6_addr.s6_addr, src_mac)' in s
          assert 'snprintf(mac_str, sizeof(mac_str), "%s", current_iface->name)' not in s
          assert 'pkt_type == LINK_RAW_IP) snprintf(ent_mac' not in s
          assert '02:<IPv4 bytes>:04' in h and '40-bit FNV-1a' in h
          assert 'OBS envelope' in s
          print('raw-IP identity integration: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub

      - name: Raw-IP identity sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_raw_identity.c -o /tmp/test-raw-id-san
          /tmp/test-raw-id-san

      - name: Existing state and identity regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-bpf && /tmp/test-bpf
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_snmpv3_engineid.c -o /tmp/test-snmpv3 && /tmp/test-snmpv3
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_cldap_netlogon.c -o /tmp/test-cldap && /tmp/test-cldap
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_kerberos_etypes.c -o /tmp/test-krb && /tmp/test-krb
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_radius.c -o /tmp/test-radius && /tmp/test-radius

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_raw_identity.h src/argos-sniffer.c tests/test_raw_identity.c
          git commit -m 'feat(v6): add stable raw-IP endpoint identities'
          git push origin HEAD:version-6
