name: V6 discovery engine consolidation gate
# Staging-only gate; production source is applied only after every check passes.

on:
  push:
    branches: [version-6]
    paths:
      - src/argos_discovery.h
      - tests/test_discovery.c
      - ci/staging/discovery-engine.patch
      - .github/workflows/v6-discovery-engine-gate.yml
  pull_request:
    branches: [version-6]
    paths:
      - src/argos-sniffer.c
      - src/argos_discovery.h
      - tests/test_discovery.c
      - ci/staging/discovery-engine.patch
      - .github/workflows/v6-discovery-engine-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-engine:
    name: Staged fixtures, sanitizers, native and ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baseline strict builds and size
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-before
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-before-stub
          size /tmp/argos-before
          size /tmp/argos-before | awk 'NR==2 {print $1}' > /tmp/before-text

      - name: Apply staged extraction
        run: |
          if grep -q '#include "argos_discovery.h"' src/argos-sniffer.c; then
            echo 'Production candidate already contains staged extraction'
            echo 155873 > /tmp/before-text
          else
            git apply --check ci/staging/discovery-engine.patch
            git apply ci/staging/discovery-engine.patch
          fi

      - name: Architecture and hot-path invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text()
          engine = Path('src/argos_discovery.h').read_text()
          assert src.count('#include "argos_discovery.h"') == 1
          for symbol in ('argos_discovery_nbns_parse', 'argos_discovery_arp_parse',
                         'argos_discovery_dhcp4_parse', 'argos_discovery_dhcp6_parse',
                         'argos_discovery_ndp_parse', 'argos_discovery_ra_parse',
                         'argos_discovery_mdns_parse', 'argos_discovery_dns_name'):
              assert symbol in engine and symbol in src
          for old in ('decode_netbios_name(', 'decode_dhcp6_name(', 'ndp_find_lladdr('):
              assert old not in src
          for forbidden in ('malloc(', 'calloc(', 'realloc(', 'emit_telemetry(',
                            'dedup_should_suppress', 'owner4_', 'owner6_', 'is_routed_source_'):
              assert forbidden not in engine
          assert 'Stateless discovery protocol decoding' in engine
          assert len(engine) < 20000
          print('Discovery engine architecture/hot-path invariants: PASS')
          PY

      - name: Golden fixtures and malformed corpus
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_discovery.c -o /tmp/test-discovery
          /tmp/test-discovery

      - name: Discovery sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_discovery.c -o /tmp/test-discovery-san
          /tmp/test-discovery-san

      - name: Full native regression matrix
        run: |
          set -eu
          for source in tests/test_*.c; do
            binary="/tmp/$(basename "$source" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$source" -lm -o "$binary"
            "$binary"
          done
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-after
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-after-stub
          before=$(cat /tmp/before-text)
          after=$(size /tmp/argos-after | awk 'NR==2 {print $1}')
          test "$after" -le "$before"
          echo "optimized .text: $before -> $after"

      - name: ARM64 strict full and stub builds
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-arm64-full
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-arm64-stub
