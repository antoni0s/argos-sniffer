name: Bump Argos version to 5.3.0

on:
  push:
    branches:
      - feature/span-sensor
    paths:
      - .github/workflows/bump-v530.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/span-sensor
      - name: Set source version
        run: |
          sed -i 's/#define VERSION "5\.2\.4"/#define VERSION "5.3.0"/' src/argos-sniffer.c
          grep -q '#define VERSION "5.3.0"' src/argos-sniffer.c
      - name: Compile check
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          /tmp/argos-sniffer --help | grep -q 'argos-sniffer v5.3.0'
      - name: Commit version bump
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/argos-sniffer.c
          git commit -m 'Bump Argos Sniffer to v5.3.0'
          git push
