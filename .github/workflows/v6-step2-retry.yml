name: V6 step 2 retry - QUIC v2

on:
  push:
    branches: [version-6]
    paths:
      - '.github/workflows/v6-step2-retry.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Re-run exact QUIC v2 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          wf = Path('.github/workflows/v6-step1-ja4.yml').read_text()
          marker = "      - name: Apply QUIC v2 support\n        run: |\n          python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          PY\n", start)
          script = textwrap.dedent(wf[start:end])
          exec(compile(script, '<quic-v2-patch>', 'exec'), {})

          # The staging workflow used a raw Python string for the C fixture,
          # leaving structural \n escapes literal. Decode one escape layer:
          # single \n becomes a real line break, while C's \\n remains \n.
          p = Path('tests/test_quic_v2.c')
          bad = p.read_text()
          p.write_text(bytes(bad, 'utf-8').decode('unicode_escape'))
          PY

      - name: QUIC v2 RFC 9369 fixture
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_quic_v2.c -o /tmp/test-quic-v2
          /tmp/test-quic-v2

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub
          git diff --check

      - name: Structural QUIC v2 checks
        run: |
          grep -F 'ARGOS_QUIC_VERSION_V2 0x6b3343cfU' src/argos_quic.h
          grep -F 'quicv2 key' src/argos_quic.h
          grep -F 'quicv2 iv' src/argos_quic.h
          grep -F 'quicv2 hp' src/argos_quic.h
          grep -F 'failure_version == 0x6b3343cfU ? "v2" : "v1"' src/argos-sniffer.c

      - name: Commit tested QUIC v2 support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos-sniffer.c src/argos_quic.h src/argos_quic_heavy.h tests/test_quic_v2.c
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v6): add RFC 9369 QUIC v2 Initial support'
          git push origin HEAD:version-6
