name: V6 step 10d - IGMP MLD gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step10d_igmp_mld_patch.py'
      - '.github/workflows/v6-step10d-igmp-mld.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step10d_igmp_mld_patch.py

      - name: IGMP MLD fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_igmp_mld.c -o /tmp/test-igmp-mld
          /tmp/test-igmp-mld

      - name: Dynamic BPF multicast matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-bpf
          /tmp/test-bpf

      - name: Multicast privacy and bounds invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_multicast_membership.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          b=Path('src/argos_bpf.h').read_text()
          assert 'records > 64U' in h and 'nsrc > 1024U' in h
          assert 'IGMP|%s' in s and 'MLD|%s' in s
          assert 'protocol == 2U && ttl == 1U' in s
          assert 'protocol == IPPROTO_ICMPV6' in s and 'ttl == 1U' in s
          assert '239.1.2.3' not in h and 'ff02' not in h.lower()
          assert 'BPF_JEQ | BPF_K, 2' in b
          print('IGMP/MLD privacy and bounds invariants: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub

      - name: IGMP MLD sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_igmp_mld.c -o /tmp/test-igmp-mld-san
          /tmp/test-igmp-mld-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_dynamic_bpf.c -o /tmp/test-bpf-san
          /tmp/test-bpf-san

      - name: Existing network regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_stun_turn.c -o /tmp/test-stun && /tmp/test-stun
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_mqtt.c -o /tmp/test-mqtt && /tmp/test-mqtt
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_coap.c -o /tmp/test-coap && /tmp/test-coap
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise && /tmp/test-enterprise

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_multicast_membership.h src/argos-sniffer.c src/argos_bpf.h tests/test_igmp_mld.c tests/test_dynamic_bpf.c
          git commit -m 'feat(v6): fingerprint IGMP and MLD membership control'
          git push origin HEAD:version-6
