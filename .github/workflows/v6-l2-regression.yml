name: V6 enterprise L2 regression

on:
  push:
    branches: [version-6]
  pull_request:
    branches: [main, version-6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l2-parsers:
    name: L2 parser fixtures and sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict parser fixtures
        run: |
          set -eu
          for t in lldp_med lacp stp rstp mstp stp_path; do
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "tests/test_${t}.c" -o "/tmp/test-${t}"
            "/tmp/test-${t}"
          done

      - name: Sanitized parser fixtures
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -eu
          for t in lldp_med lacp stp rstp mstp stp_path; do
            cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              "tests/test_${t}.c" -o "/tmp/test-${t}-san"
            "/tmp/test-${t}-san"
          done

      - name: L2 integration and privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/argos-sniffer.c').read_text()
          l2 = Path('src/argos_l2.h').read_text()
          bpf = Path('src/argos_bpf.h').read_text()
          for proto in ('STP', 'RSTP', 'MSTP', 'LACP', 'LLDP-MED'):
              assert f'|-|-|{proto}|' in src
          assert 'argos_dispatch_l2_protocol(l3_proto) == ARGOS_PROTOCOL_STP' in src
          assert 'argos_dispatch_protocol_enabled(&dispatch_plan, ARGOS_PROTOCOL_STP)' in src
          assert 'BPF_JGT | BPF_K, 1500' in bpf
          assert 'argos_rstp_parse' in l2 and 'argos_mstp_parse' in l2
          for parser, result in (('stp', 'stp'), ('rstp', 'stp'), ('mstp', 'mstp')):
              assert f'argos_{parser}_parse(buffer + l3_offset, (size_t)(l3_packet_end - l3_offset), &{result})' in src
          assert '32-byte MST configuration name is intentionally not emitted' in l2
          assert 'subtype == 3U' not in l2
          assert '#include "argos_l2.h"' in src

          # Standalone v6 staging modules may coexist in src/, but they must
          # remain isolated from the production L2 runtime until migration.
          for staged in ('argos_stp.h', 'argos_lldp_med.h', 'argos_lacp.h'):
              assert Path('src', staged).exists()
              assert f'#include "{staged}"' not in src
              assert f'#include "{staged}"' not in l2
          print('enterprise L2 permanent invariants: PASS')
          PY
