name: V6 runtime state ownership gate

on:
  push:
    branches: [version-6]
    paths: [ci/staging/state-engine.patch, .github/workflows/v6-state-engine-gate.yml]
  pull_request:
    branches: [version-6]
    paths:
      - src/argos-sniffer.c
      - src/argos_flow_state.h
      - tests/test_runtime_state.c
      - .github/workflows/v6-flow-regression.yml
      - .github/workflows/v6-network-regression.yml
      - ci/staging/state-engine.patch
      - .github/workflows/v6-state-engine-gate.yml
  workflow_dispatch:

permissions: {contents: read}

jobs:
  state-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baseline builds and measurements
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/before
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/before-stub
          size /tmp/before | awk 'NR==2 {print $1, $3}' > /tmp/before-size
      - name: Prepare staged or PR candidate
        run: |
          if grep -q 'static argos_runtime_state_t runtime_state' src/argos-sniffer.c; then
            echo '155221 80720' > /tmp/before-size
          else
            git apply --check ci/staging/state-engine.patch
            git apply ci/staging/state-engine.patch
          fi
      - name: Architecture invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/argos-sniffer.c').read_text(); f=Path('src/argos_flow_state.h').read_text()
          assert 'static argos_runtime_state_t runtime_state;' in s
          for field in ('application', 'udp_suppress', 'dns_track', 'dedup'):
              assert field in f
          for symbol in ('argos_syn_track_find', 'argos_runtime_state_enable_extended_metrics',
                         'argos_runtime_state_destroy'):
              assert symbol in f
          for old in ('syn_table', 'dns_table', 'dedup_state', 'app_flow_state', 'udp_suppress_table'):
              assert old not in s
          assert f.count('calloc(') == 2
          assert len(f) < 16000
          print('runtime state ownership invariants: PASS')
          PY
      - name: Focused fixtures and sanitizers
        env: {ASAN_OPTIONS: detect_leaks=1:halt_on_error=1, UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1}
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_runtime_state.c -o /tmp/state
          /tmp/state
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_runtime_state.c -o /tmp/state-san
          /tmp/state-san
      - name: Full native matrix and bounded size
        run: |
          set -eu
          for source in tests/test_*.c; do
            binary="/tmp/$(basename "$source" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$source" -lm -o "$binary"
            "$binary"
          done
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/after
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/after-stub
          read before_text before_bss < /tmp/before-size
          read after_text _ after_bss _ < <(size /tmp/after | awk 'NR==2 {print $1, $2, $3, $4}')
          test "$after_text" -le $((before_text + 256))
          test "$after_bss" -eq "$before_bss"
          echo "text $before_text -> $after_text; bss $before_bss -> $after_bss"
      - name: ARM64 strict full and stub
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/arm64-full
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/arm64-stub
