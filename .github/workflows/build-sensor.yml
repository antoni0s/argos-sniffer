name: Build Argos Sensor v5.3.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build v5.3.1 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-amd64
            compiler: gcc
            output: argos-sniffer-v5.3.1-linux-amd64
          - arch: linux-arm64
            compiler: aarch64-linux-gnu-gcc
            output: argos-sniffer-v5.3.1-linux-arm64

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install ARM64 cross compiler
        if: matrix.arch == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build v5.3.1
        run: |
          grep -q '#define VERSION "5.3.1"' src/argos-sniffer.c
          ${{ matrix.compiler }} \
            -std=c11 -O2 -Wall -Wextra -Wpedantic \
            src/argos-sniffer.c \
            -lm \
            -o ${{ matrix.output }}
          chmod +x ${{ matrix.output }}

      - name: Verify binary
        run: |
          file ${{ matrix.output }}
          ls -lh ${{ matrix.output }}

      - name: Smoke test AMD64 v5.3.1 sensor CLI
        if: matrix.arch == 'linux-amd64'
        run: |
          ./${{ matrix.output }} --help >/tmp/argos-help.txt
          grep -q 'argos-sniffer v5.3.1' /tmp/argos-help.txt
          grep -q -- '--sensor' /tmp/argos-help.txt
          grep -q -- '--sensor-name' /tmp/argos-help.txt
          grep -q -- '--inside' /tmp/argos-help.txt

      - name: Upload v5.3.1 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
