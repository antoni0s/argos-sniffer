name: Validate Argos Sniffer v5.3.1 2 MiB receive buffer

on:
  push:
    branches:
      - feature/span-sensor
    paths:
      - .github/workflows/rcvbuf-2m-v531.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/span-sensor

      - name: Increase AF_PACKET receive buffer
        shell: bash
        run: |
          grep -q 'int rcvbuf = 1024 \* 1024;' src/argos-sniffer.c
          sed -i 's/int rcvbuf = 1024 \* 1024;/int rcvbuf = 2 * 1024 * 1024;/' src/argos-sniffer.c
          grep -q 'int rcvbuf = 2 \* 1024 \* 1024;' src/argos-sniffer.c
          grep -q '#define VERSION "5.3.1"' src/argos-sniffer.c

      - name: Strict compile validation
        shell: bash
        run: |
          git diff --check
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          /tmp/argos-sniffer 2>&1 | grep -q 'argos-sniffer v5.3.1'
          grep -q 'recvmsg(current_iface->fd, &msg, MSG_TRUNC)' src/argos-sniffer.c
          ! grep -q 'RX_DRAIN_BUDGET' src/argos-sniffer.c
          ! grep -q 'MSG_TRUNC | MSG_DONTWAIT' src/argos-sniffer.c

      - name: Commit validated receive-buffer change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/argos-sniffer.c
          git diff --cached --check
          git commit -m 'Tune 5.3.1: increase AF_PACKET receive buffer to 2 MiB'
          git push
