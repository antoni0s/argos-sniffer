name: V6 step 8d - SNMPv3 EngineID gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step8d_snmpv3_engineid_patch.py'
      - '.github/workflows/v6-step8d-snmpv3-engineid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: |
          python3 .github/scripts/v6_step8d_snmpv3_engineid_patch.py
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_enterprise.h'); s=h.read_text()
          s=s.replace('if (security_model != 3) return 0; pos=hn;', 'if (security_model != 3) return 0;\n    pos=hn;')
          s=s.replace('if (w<0 || (size_t)w>=sizeof(value)-used) break; used+=(size_t)w;', 'if (w<0 || (size_t)w>=sizeof(value)-used) break;\n            used+=(size_t)w;')
          h.write_text(s)
          t=Path('tests/test_snmpv3_engineid.c'); q=t.read_text()
          q=q.replace('    unsigned char discovery[360];memcpy(discovery,msg,m);\n', '')
          t.write_text(q)
          PY

      - name: SNMPv3 EngineID fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_snmpv3_engineid.c -o /tmp/test-snmpv3
          /tmp/test-snmpv3

      - name: SNMPv3 privacy/integration invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_enterprise.h').read_text()
          assert 'msgSecurityParameters OCTET STRING' in h
          assert 'never the raw EngineID, userName, auth or' in h
          assert 'engine_hash=%08x engine_len=%u enterprise=%u format=%u' in h
          assert 'case 161: case 162: return ae_snmp' in h
          assert 'private-user' not in h
          print('SNMPv3 EngineID integration/privacy: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub

      - name: SNMPv3 sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_snmpv3_engineid.c -o /tmp/test-snmpv3-san
          /tmp/test-snmpv3-san

      - name: Existing identity regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_cldap_netlogon.c -o /tmp/test-cldap && /tmp/test-cldap
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_kerberos_etypes.c -o /tmp/test-krb && /tmp/test-krb
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_radius.c -o /tmp/test-radius && /tmp/test-radius
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise && /tmp/test-enterprise

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_enterprise.h tests/test_snmpv3_engineid.c
          git commit -m 'feat(v6): fingerprint SNMPv3 EngineID metadata'
          git push origin HEAD:version-6
