name: V6 staging module audit

on:
  pull_request:
    branches: [version-6]
  push:
    branches: [version-6]
    paths:
      - 'src/argos_ah.h'
      - 'src/argos_airplay.h'
      - 'src/argos_cast.h'
      - 'src/argos_dlna.h'
      - 'src/argos_dnp3.h'
      - 'src/argos_esp.h'
      - 'src/argos_ftp.h'
      - 'src/argos_http_proxy.h'
      - 'src/argos_ike.h'
      - 'src/argos_knx.h'
      - 'src/argos_ldap.h'
      - 'src/argos_ldaps.h'
      - 'src/argos_lpd.h'
      - 'src/argos_matter.h'
      - 'src/argos_mongodb.h'
      - 'src/argos_nvmeof.h'
      - 'src/argos_opcua.h'
      - 'src/argos_openvpn.h'
      - 'src/argos_redis.h'
      - 'src/argos_rtcp.h'
      - 'src/argos_rtp.h'
      - 'src/argos_rtsp.h'
      - 'src/argos_s7.h'
      - 'src/argos_tacacs.h'
      - 'src/argos_telnet.h'
      - 'src/argos_thread.h'
      - 'src/argos_vnc.h'
      - 'src/argos_winrm.h'
      - 'tests/test_staging_headers.c'
      - 'tests/test_staging_semantics.c'
      - 'src/*_staging.h'
      - 'tests/test_*_staging.c'
      - 'src/argos-sniffer.c'
      - '.github/workflows/v6-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Strict compile and semantic validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict all-header translation unit
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/test_staging_headers.c -o /tmp/test-staging-headers
          /tmp/test-staging-headers

      - name: Protocol semantic fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/test_staging_semantics.c -o /tmp/test-staging-semantics
          /tmp/test-staging-semantics

      - name: Isolated enrichment fixtures
        run: |
          set -eu
          for source in tests/test_*_staging.c; do
            binary="/tmp/$(basename "$source" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$source" -o "$binary"
            "$binary"
          done

      - name: ASan + UBSan boundary validation
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_staging_headers.c -o /tmp/test-staging-headers-san
          /tmp/test-staging-headers-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_staging_semantics.c -o /tmp/test-staging-semantics-san
          /tmp/test-staging-semantics-san
          for source in tests/test_*_staging.c; do
            binary="/tmp/$(basename "$source" .c)-san"
            cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer "$source" -o "$binary"
            "$binary"
          done

      - name: Staging architecture invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          headers = sorted(Path('src').glob('argos_*.h'))
          staging = {
              'argos_ah.h','argos_airplay.h','argos_cast.h','argos_dlna.h','argos_dnp3.h',
              'argos_esp.h','argos_ftp.h','argos_http_proxy.h','argos_ike.h',
              'argos_knx.h','argos_ldap.h','argos_ldaps.h',
              'argos_lpd.h','argos_matter.h','argos_mongodb.h','argos_nvmeof.h',
              'argos_opcua.h','argos_openvpn.h','argos_redis.h',
              'argos_rtcp.h','argos_rtp.h','argos_rtsp.h','argos_s7.h',
              'argos_tacacs.h','argos_telnet.h','argos_thread.h',
              'argos_vnc.h','argos_winrm.h'
          }
          present = {p.name for p in headers}
          staging.update(p.name for p in Path('src').glob('*_staging.h'))
          missing = staging - present
          assert not missing, f'missing staging headers: {sorted(missing)}'

          # Follow all quoted project includes, not just direct main includes.
          # Runtime isolation is independent of standalone parser test success.
          visited = set()
          pending = [Path('src/argos-sniffer.c')]
          while pending:
              source = pending.pop()
              if source in visited:
                  continue
              visited.add(source)
              assert source.name not in staging, f'runtime imports staging: {source}'
              for name in re.findall(r'^\s*#\s*include\s*"([^"]+)"', source.read_text(), re.M):
                  dependency = source.parent / name
                  assert dependency.is_file(), f'missing include: {dependency}'
                  pending.append(dependency)

          forbidden = ('malloc(', 'calloc(', 'realloc(', 'emit_telemetry(',
                       'dedup_should_suppress', 'sendto(', 'write(')
          for name in sorted(staging):
              text = Path('src', name).read_text()
              assert '#ifndef ' in text and '#define ' in text and '#endif' in text, name
              for token in forbidden:
                  assert token not in text, f'{name}: forbidden runtime/hot-path token {token}'
          print(f'Staging headers validated: {len(staging)}')
          PY
