name: V6 step 10a - STUN TURN gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step10a_stun_turn_patch.py'
      - '.github/workflows/v6-step10a-stun-turn.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-6
        uses: actions/checkout@v4
        with:
          ref: version-6
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 .github/scripts/v6_step10a_stun_turn_patch.py

      - name: STUN TURN control fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_stun_turn.c -o /tmp/test-stun-turn
          /tmp/test-stun-turn

      - name: Dynamic BPF relay fast-drop matrix
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_dynamic_bpf.c -o /tmp/test-bpf
          /tmp/test-bpf

      - name: STUN TURN privacy and performance invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_enterprise.h').read_text()
          b=Path('src/argos_bpf.h').read_text()
          p=Path('src/argos_enterprise_ports.h').read_text()
          assert 'ARGOS_STUN_TURN_UDP_PORT 3478U' in p
          assert 'case 3478: return ae_stun_turn' in h
          assert 'method == 0x006U || method == 0x007U' in h
          assert 'case 0x0013U: return 0' in h
          for secret in ('transaction ID', 'USERNAME, REALM', 'NONCE, USERHASH'):
              assert secret in h
          assert 'ARGOS_ENTERPRISE_UDP_PORTS[i] == ARGOS_STUN_TURN_UDP_PORT' in b
          assert 'BPF_ALU | BPF_AND | BPF_K, 0xc0' in b
          assert '0x0016' in b and '0x0017' in b
          assert 'ChannelData' in b and 'elephant flow' in b
          print('STUN/TURN privacy/performance invariants: PASS')
          PY

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-v6-stub

      - name: STUN TURN sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_stun_turn.c -o /tmp/test-stun-turn-san
          /tmp/test-stun-turn-san
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_dynamic_bpf.c -o /tmp/test-bpf-san
          /tmp/test-bpf-san

      - name: Existing enterprise and identity regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise && /tmp/test-enterprise
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_raw_identity.c -o /tmp/test-raw-id && /tmp/test-raw-id
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_radius.c -o /tmp/test-radius && /tmp/test-radius

      - name: Commit only after every gate passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_enterprise_ports.h src/argos_enterprise.h src/argos_bpf.h tests/test_dynamic_bpf.c tests/test_stun_turn.c
          git commit -m 'feat(v6): fingerprint STUN TURN control metadata'
          git push origin HEAD:version-6
