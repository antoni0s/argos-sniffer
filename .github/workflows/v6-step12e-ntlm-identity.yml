name: V6 step 12e - NTLM identity gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step12e_ntlm_identity.py'
      - '.github/scripts/v6_step12e_ntlm_identity_bounds.py'
      - '.github/workflows/v6-step12e-ntlm-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ntlm-identity-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged NTLM identity patch
        run: |
          python3 .github/scripts/v6_step12e_ntlm_identity.py
          python3 .github/scripts/v6_step12e_ntlm_identity_bounds.py

      - name: NTLM Type 3 identity fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_ntlm.c -o /tmp/test-identity-ntlm
          /tmp/test-identity-ntlm

      - name: NTLM identity sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_identity_ntlm.c -o /tmp/test-identity-ntlm-san
          /tmp/test-identity-ntlm-san

      - name: NTLM identity privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('src/argos_identity.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          t=Path('tests/test_identity_ntlm.c').read_text()
          assert 'argos_identity_ntlm_type3' in h
          assert 'DomainName, UserName and' in h
          assert 'LM/NT responses, session keys' in h
          assert 'secbuf_off + 8U > remain' in h
          assert '(bytes & 1U) != 0U' in h
          assert '(size_t)bytes > remain - (size_t)off' in h
          assert 'argos_identity_ntlm_utf16_field(n, remain, 28U, "domain"' in h
          assert 'argos_identity_ntlm_utf16_field(n, remain, 36U, "user"' in h
          assert 'argos_identity_ntlm_utf16_field(n, remain, 44U, "workstation"' in h
          assert 'if (opt_identity && dport == 445U' in s
          assert '%.45s|%.23s|%.23s|%.191s' in s
          assert 'ids[ii].protocol' in s and 'ids[ii].type' in s and 'ids[ii].value' in s
          assert 'LM-SECRET-DO-NOT-EMIT' not in h and 'NT-SECRET-DO-NOT-EMIT' not in h
          assert 'LM-SECRET-DO-NOT-EMIT' not in s and 'NT-SECRET-DO-NOT-EMIT' not in s
          assert 'LM-SECRET-DO-NOT-EMIT' in t and 'NT-SECRET-DO-NOT-EMIT' in t
          print('NTLM identity privacy invariants: PASS')
          PY

      - name: Existing privacy identity and flow regressions
        run: |
          for f in tests/test_ntlm_privacy.c tests/test_ntlm_flow_completion.c tests/test_identity_framework.c tests/test_identity_rdp.c tests/test_enterprise.c; do
            out="/tmp/$(basename "$f" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$f" -o "$out"
            "$out"
          done

      - name: Strict full and stub builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

      - name: Commit production extractor only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/argos_identity.h src/argos-sniffer.c tests/test_identity_ntlm.c
          git diff --cached --quiet && exit 0
          git commit -m "feat(v6): extract bounded NTLM Type 3 observed identity"
          git push origin HEAD:version-6
