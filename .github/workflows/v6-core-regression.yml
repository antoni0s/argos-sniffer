name: V6 core architecture regression
on:
  pull_request:
    branches: [version-6]
  push:
    branches: [version-6]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict standalone matrix and native full/stub
        run: |
          set -eu
          python3 tests/check_transport_adoption.py
          python3 tests/check_network_adoption.py
          for source in tests/test_*.c; do
            binary="/tmp/$(basename "$source" .c)"
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror "$source" -lm -o "$binary"
            "$binary"
          done
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/stub
          size /tmp/full /tmp/stub
          # Normalized transport entry must specialize inline in production.
          if nm /tmp/full /tmp/stub | grep -q 'argos_packet_transport'; then exit 1; fi
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/bench_transport.c -o /tmp/bench-transport
          /tmp/bench-transport
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/bench_packet_ah.c -o /tmp/bench-packet-ah
          /tmp/bench-packet-ah
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/bench_network_context.c -o /tmp/bench-network
          /tmp/bench-network
          if nm /tmp/full /tmp/stub | grep -Eq 'argos_network_context|argos_network_router_exception|argos_packet_tcp_header_length'; then exit 1; fi
      - name: Packet, transport and capture contract sanitizers
        run: |
          set -eu
          for source in tests/test_packet.c tests/test_packet_ah.c tests/test_bpf_capacity.c tests/test_nonport_contract.c tests/test_encapsulation.c tests/test_packet_fragments.c tests/test_link_contract.c tests/test_inspector.c tests/test_router_exception.c tests/test_transport.c tests/test_capture.c tests/test_capture_contract.c tests/test_network.c tests/test_network_context.c tests/test_telemetry.c; do
            binary="/tmp/$(basename "$source" .c)-san"
            cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer "$source" -lm -o "$binary"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$binary"
          done
      - name: ARM64 full/stub and transport fixture compile
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/arm-full
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/arm-stub
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_transport.c -o /tmp/arm-transport
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_packet_ah.c -lm -o /tmp/arm-packet-ah
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/bench_packet_ah.c -o /tmp/arm-bench-packet-ah
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_bpf_capacity.c -lm -o /tmp/arm-bpf-capacity
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_nonport_contract.c -lm -o /tmp/arm-nonport
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_encapsulation.c -lm -o /tmp/arm-encapsulation
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_packet_fragments.c -o /tmp/arm-packet-fragments
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_link_contract.c -o /tmp/arm-link-contract
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_inspector.c -lm -o /tmp/arm-inspector
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_router_exception.c -o /tmp/arm-router-exception
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_capture_contract.c -o /tmp/arm-capture-contract
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_network.c -o /tmp/arm-network-context
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_network_context.c -o /tmp/arm-network-matrix
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_telemetry.c -o /tmp/arm-telemetry-context
          if aarch64-linux-gnu-nm /tmp/arm-full /tmp/arm-stub | grep -q 'argos_packet_transport'; then exit 1; fi
          if aarch64-linux-gnu-nm /tmp/arm-full /tmp/arm-stub | grep -Eq 'argos_network_context|argos_network_router_exception|argos_packet_tcp_header_length'; then exit 1; fi
      - name: Text and BSS budget (explicit approval required to revise)
        run: |
          set -eu
          # PR #12: user-approved single-scan network policy tradeoff, +812
          # full text vs 155629 baseline. No extra headroom or BSS increase.
          size /tmp/full /tmp/stub
          test "$(size /tmp/full | awk 'NR==2 {print $1}')" -le 156441
          test "$(size /tmp/full | awk 'NR==2 {print $3}')" -le 80304
