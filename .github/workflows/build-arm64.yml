name: Build ARM64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Strict compile checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full QUIC version
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            src/argos-sniffer.c -lm -o /tmp/argos-sniffer-full

      - name: Build QUIC stub version
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-stub

  arm64:
    name: ARM64 static + UPX
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read source version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^#define VERSION "\([^"]*\)"/\1/p' src/argos-sniffer.c | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Argos Sniffer $VERSION"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build static ARM64 musl binary
        shell: bash
        run: |
          mkdir -p dist
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work alpine:latest sh -ec '
              apk add --no-cache gcc musl-dev linux-headers
              cc -std=c11 -Os -Wall -Wextra -Wpedantic -Werror \
                -static -ffunction-sections -fdata-sections \
                -Wl,--gc-sections \
                src/argos-sniffer.c -lm \
                -o dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64
              strip dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64
            '

      - name: Verify ARM64 binary
        shell: bash
        run: |
          file dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64
          readelf -h dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64 | grep -E 'Class:|Machine:'
          if readelf -l dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64 | grep -q 'Requesting program interpreter'; then
            echo 'ERROR: ARM64 binary is dynamically linked'
            exit 1
          fi

      - name: Install UPX 5.2.0
        shell: bash
        run: |
          curl -fsSLO https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-amd64_linux.tar.xz
          echo '3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1  upx-5.2.0-amd64_linux.tar.xz' | sha256sum -c -
          tar -xf upx-5.2.0-amd64_linux.tar.xz
          echo "$PWD/upx-5.2.0-amd64_linux" >> "$GITHUB_PATH"

      - name: Create UPX-compressed ARM64 binary
        shell: bash
        run: |
          cp \
            dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64 \
            dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64-upx
          upx --best --lzma dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64-upx
          upx -t dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64-upx

      - name: Generate checksums and size report
        shell: bash
        run: |
          cd dist
          sha256sum \
            argos-sniffer-${{ steps.version.outputs.version }}-arm64 \
            argos-sniffer-${{ steps.version.outputs.version }}-arm64-upx \
            > SHA256SUMS
          ls -lh \
            argos-sniffer-${{ steps.version.outputs.version }}-arm64 \
            argos-sniffer-${{ steps.version.outputs.version }}-arm64-upx \
            SHA256SUMS
          cat SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-sniffer-${{ steps.version.outputs.version }}-arm64
          path: |
            dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64
            dist/argos-sniffer-${{ steps.version.outputs.version }}-arm64-upx
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish tagged GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "ERROR: tag $TAG does not match source VERSION $VERSION"
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Argos Sniffer $VERSION" \
              --generate-notes
          fi

          gh release upload "$TAG" \
            "dist/argos-sniffer-$VERSION-arm64" \
            "dist/argos-sniffer-$VERSION-arm64-upx" \
            "dist/SHA256SUMS" \
            --clobber
