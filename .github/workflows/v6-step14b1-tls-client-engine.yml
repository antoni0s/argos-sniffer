name: V6 step 14b1 - TLS client engine gate

on:
  push:
    branches: [version-6]
    paths:
      - '.github/scripts/v6_step14b1_tls_client_engine.py'
      - '.github/workflows/v6-step14b1-tls-client-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged TLS client extraction
        run: python3 .github/scripts/v6_step14b1_tls_client_engine.py

      - name: Architecture and compatibility invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('src/argos_tls.h').read_text()
          s=Path('src/argos-sniffer.c').read_text()
          assert '#include "argos_tls.h"' in s
          assert 'argos_tls_client_result_t' in t
          assert 'argos_tls_client_parse' in t
          assert 'dedup_should_suppress' not in t
          assert 'emit_telemetry' not in t
          assert 'source_dedup_signature' not in t
          assert 'static void parse_tls_sni' in s
          assert 'argos_tls_client_parse(payload, len, &tls)' in s
          assert 'TLS|%s|%s|%s|%u|%s|%s|%s%s' in s
          assert 'DOT|%s|%s|%s|%s|%s|%s%s' in s
          assert 'char alpn_first = \'0\', alpn_last = \'0\';' in t
          fallback='if (alpn[0] == \'\\0\') strcpy(alpn, "none");'
          use='a_cipher_count, a_ext_count, alpn_first, alpn_last'
          decl="char alpn_first = '0', alpn_last = '0';"
          assert t.index(decl) < t.index(fallback) < t.index(use)
          assert "c < 32U || c > 126U || c == '|'" in t
          assert "c = ' ';" in t
          assert 'SECTION: Micro MD5 Implementation' not in s
          assert 'static int cmp_uint16(' not in s
          assert 'static inline int is_grease16(' not in s
          print('TLS client engine architecture/compatibility invariants: PASS')
          PY

      - name: TLS ClientHello result fixture
        run: |
          cat >/tmp/test-tls-client.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include "src/argos_tls.h"

          static size_t build_client_hello(unsigned char *b, size_t cap) {
              if (cap < 128U) return 0U;
              size_t p = 0U;
              b[p++]=0x16; b[p++]=0x03; b[p++]=0x01; b[p++]=0; b[p++]=0;
              b[p++]=0x01; b[p++]=0; b[p++]=0; b[p++]=0;
              b[p++]=0x03; b[p++]=0x03;
              memset(b+p, 0x11, 32U); p += 32U;
              b[p++]=0;
              b[p++]=0; b[p++]=4; b[p++]=0x13; b[p++]=0x01; b[p++]=0x13; b[p++]=0x02;
              b[p++]=1; b[p++]=0;
              size_t ext_len_pos=p; b[p++]=0; b[p++]=0;
              const char *host="example.com";
              b[p++]=0; b[p++]=0; b[p++]=0; b[p++]=16;
              b[p++]=0; b[p++]=14; b[p++]=0; b[p++]=0; b[p++]=11;
              memcpy(b+p, host, 11U); p += 11U;
              b[p++]=0; b[p++]=16; b[p++]=0; b[p++]=5;
              b[p++]=0; b[p++]=3; b[p++]=2; b[p++]='h'; b[p++]='2';
              b[p++]=0; b[p++]=0x2b; b[p++]=0; b[p++]=5;
              b[p++]=4; b[p++]=0x03; b[p++]=0x04; b[p++]=0x03; b[p++]=0x03;
              size_t ext_len = p - (ext_len_pos + 2U);
              b[ext_len_pos]=(unsigned char)(ext_len>>8); b[ext_len_pos+1]=(unsigned char)ext_len;
              size_t hs_len=p-9U;
              b[6]=(unsigned char)(hs_len>>16); b[7]=(unsigned char)(hs_len>>8); b[8]=(unsigned char)hs_len;
              size_t rec_len=p-5U;
              b[3]=(unsigned char)(rec_len>>8); b[4]=(unsigned char)rec_len;
              return p;
          }

          int main(void) {
              unsigned char b[256]={0};
              size_t n=build_client_hello(b,sizeof(b));
              argos_tls_client_result_t r1,r2;
              if (!n || !argos_tls_client_parse(b,(int)n,&r1)) return 1;
              if (strcmp(r1.sni,"example.com") != 0) return 2;
              if (strcmp(r1.alpn,"h2") != 0) return 3;
              if (strncmp(r1.ja4,"t13d0201h2_",11) != 0) return 4;
              if (strlen(r1.ja4) != 36U) return 5;
              if (!argos_tls_client_parse(b,(int)n,&r2)) return 6;
              if (strcmp(r1.ja4,r2.ja4) != 0) return 7;
              b[5]=0x02;
              if (argos_tls_client_parse(b,(int)n,&r2)) return 8;
              puts("TLS ClientHello engine fixture: PASS");
              return 0;
          }
          EOF
          cc -I. -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror /tmp/test-tls-client.c -o /tmp/test-tls-client
          /tmp/test-tls-client

      - name: TLS ClientHello sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -I. -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            /tmp/test-tls-client.c -o /tmp/test-tls-client-san
          /tmp/test-tls-client-san

      - name: Existing TLS server and QUIC fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_tls_server.c -o /tmp/test-tlssrv
          /tmp/test-tlssrv
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_quic_v2.c -o /tmp/test-quic-v2
          /tmp/test-quic-v2

      - name: Existing flow enterprise and identity fixtures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_app_flow.c -lm -o /tmp/test-app-flow
          /tmp/test-app-flow
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_enterprise.c -o /tmp/test-enterprise
          /tmp/test-enterprise
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror tests/test_identity_framework.c -o /tmp/test-identity-framework
          /tmp/test-identity-framework

      - name: Strict native builds
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-full
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -DARGOS_QUIC_STUB src/argos-sniffer.c -lm -o /tmp/argos-sniffer-v6-stub

      - name: Commit production TLS client engine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/argos_tls.h src/argos-sniffer.c
          git diff --cached --check
          git commit -m 'refactor(v6): extract TLS client engine'
          git push origin HEAD:version-6
